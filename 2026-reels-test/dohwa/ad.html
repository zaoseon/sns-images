     글 칸 x 50~900(가운데 FXK.cx), y 450~1365. -->

<div id="a3" class="t" style="top:1110px;font:800 84px/1.1 PR;color:#fff">꼭 그렇진 않아요</div>

<script src="../../pipeline/motion_fx.js"></script>
<script>
window.FX=['글자스태거','타일뒤집기','사전정의','구조도','링네개'];
const {cl,mix,ease,eio,sp}=FXK,PK='#FF4F9A',PK2='#FFB3D1',BK='#171717',BK2='#4D4D4D',GY='#F5F5F5',W='#FFFFFF',MID='#555555';
const $=id=>document.getElementById(id),g=$('cv').getContext('2d'),vis=(id,on)=>$(id).style.display=on?'':'none';
const ROWS=[['호랑이·말·개','묘'],['뱀·닭·소','오'],['원숭이·쥐·용','유'],['돼지·토끼·양','자']];
const MON=[['3월','호랑이·말·개'],['6월','소·뱀·닭'],['9월','쥐·용·원숭이'],['12월','돼지·토끼·양']];
const DEF='사람을 끌어당기는\n매력과 표현으로\n읽는 글자예요';
window.SFX=[{t:.05,k:'press'},{t:.45,k:'swoosh'},{t:.65,k:'chime'},{t:2.3,k:'swoosh'},{t:2.75,k:'press'},{t:2.65,k:'tick'},{t:2.85,k:'tick'},{t:3.05,k:'tick'},{t:3.3,k:'chime'},
 {t:5.0,k:'swoosh'},{t:5.45,k:'tick'},{t:5.55,k:'tick'},{t:5.65,k:'tick'},{t:5.75,k:'tick'},{t:6.1,k:'chime'},{t:7.0,k:'chime'},{t:7.9,k:'chime'},{t:8.8,k:'chime'},
 {t:9.8,k:'swoosh'},{t:10.3,k:'tick'},{t:10.9,k:'tick'},{t:11.5,k:'tick'},{t:12.1,k:'tick'},{t:12.5,k:'swoosh'},{t:13.0,k:'chime'},{t:14.3,k:'press'}];
// 타일뒤집기: 판이 도미노처럼 다음 판 색으로 뒤집힘
function tiles(t,t0,col){if(t<t0||t>t0+.45)return;const cw=180,ch=192;g.save();g.fillStyle=col;
 for(let j=0;j<10;j++)for(let i=0;i<6;i++){const k=eio(cl((t-t0-(i+j)*.02)/.16));if(k<=0)continue;const x=i*cw,y=j*ch,h=ch*k;g.fillRect(x,y+(ch-h)/2,cw+1,h+1)}g.restore()}
// 꽃잎: 훅 첫 1초, '인기' 주변에서 피었다 사라짐
function petal(x,y,r,rot,a){g.save();g.translate(x,y);g.rotate(rot);g.globalAlpha=a;g.fillStyle=PK;for(let k=0;k<5;k++){g.rotate(Math.PI*2/5);g.beginPath();g.ellipse(0,-r*.55,r*.32,r*.55,0,0,7);g.fill()}
 g.fillStyle=PK2;g.beginPath();g.arc(0,0,r*.18,0,7);g.fill();g.restore()}
function burst(t){if(t<.35||t>1.25)return;const u=(t-.35)/.9;const P=[[-1,-.7],[.9,-.8],[-1.05,.45],[1.1,.35],[0,-1.15],[-.4,1.05],[.5,1.0]];
 P.forEach(([dx,dy],i)=>{const d=mix(80,330,eio(cl(u*1.4)));petal(FXK.cx+dx*d*1.25,853+dy*d*.62,mix(10,34,sp(t-.35-i*.03,12,.6)),u*2+i,1-cl((u-.6)/.4))})}
function chip(x,y,w,h,txt,a){g.save();g.globalAlpha=cl(a);g.fillStyle=BK2;g.beginPath();g.roundRect(x,y,w,h,h/2);g.fill();g.fillStyle=W;g.font='800 60px PR';g.textAlign='center';g.textBaseline='middle';g.fillText(txt,x+w/2,y+h/2+3);g.restore()}
function tree(t,t0){const X0=60,W0=460,H=120,ys=[690,860,1030,1200],CX2=790,R=80;
 ROWS.forEach(([grp,ch],i)=>{const y=ys[i],a=sp(t-t0-i*.1,14,.7);if(a<=0)return;g.save();g.translate((1-cl(a))*-80,0);chip(X0,y,W0,H,grp,a);g.restore();
  const s0=t0+.8+i*.9,p=eio(cl((t-s0)/.35));if(p>0){g.save();g.strokeStyle=PK;g.lineWidth=10;g.lineCap='round';g.beginPath();g.moveTo(X0+W0+28,y+H/2);g.lineTo(mix(X0+W0+28,CX2-R-24,p),y+H/2);g.stroke();g.restore()}
  const c=sp(t-s0-.3,15,.55);if(c>0){const lit=t>=s0+.3&&t<s0+.9;g.save();g.translate(CX2,y+H/2);g.scale(c,c);g.fillStyle=lit?PK:'#C93C7B';g.beginPath();g.arc(0,0,R,0,7);g.fill();
   g.fillStyle=W;g.font='900 64px PL';g.textAlign='center';g.textBaseline='middle';g.fillText(ch,0,5);g.restore()}})}
function rings(t,t0){const cy=915,R=90,xs=[157,369,581,793];
 MON.forEach(([m],i)=>{const a=sp(t-t0+.25-i*.06,14,.7);if(a<=0)return;const s1=t0+i*.6,p=eio(cl((t-s1)/.45)),on=t>=s1&&t<s1+.6;
  g.save();g.translate(xs[i],cy);g.scale(cl(a),cl(a));g.lineCap='round';g.fillStyle='#E4E4E4';g.beginPath();g.arc(0,0,100,0,7);g.fill();
  if(p>0){g.lineWidth=12;g.strokeStyle=PK;g.beginPath();g.arc(0,0,100,-Math.PI/2,-Math.PI/2+6.283*p);g.stroke()}
  if(on){g.fillStyle=PK;g.beginPath();g.arc(0,0,106,0,7);g.fill()}
  g.fillStyle=on?W:BK;g.font='900 60px PL';g.textAlign='center';g.textBaseline='middle';g.fillText(m,0,5);g.restore()});
 const k=Math.max(0,Math.min(3,Math.floor((t-t0)/.6)));if(t>=t0){$('m2').textContent=MON[k][1];$('m2').style.transform=`scale(${mix(1.25,1,sp(t-t0-k*.6,16,.6))})`}}
function draw0(t){
 let bg=BK;if(t>=2.45)bg=GY;if(t>=5.15)bg=BK;if(t>=9.95)bg=GY;if(t>=12.65)bg=PK;g.fillStyle=bg;g.fillRect(0,0,1080,1920);
 // 1 훅: 0초부터 글자가 보인다(K-139). 한 자씩 기울며 들어오는 '인기 많다?' → '꼭 그렇진 않아요'
 const s1=t<2.4;['a1','a2','a3'].forEach(i=>vis(i,s1));
 if(s1){$('a1').style.transform=`scale(${mix(.9,1,sp(t+.3,15,.6))})`;const b=sp(t+.12,16,.5);$('a2').style.transform=`scale(${mix(.82,1,b)}) rotate(${mix(-5,0,b)}deg)`;
  burst(t);const c=sp(t-.6,15,.55);$('a3').style.opacity=t>=.6?1:0;$('a3').style.transform=`translateY(${(1-c)*60}px) scale(${mix(1.2,1,c)})`;
  if(t>=.6)$('a2').style.color=PK}
 tiles(t,2.2,GY);
 // 2 사전정의: 큰 낱말 + 뜻이 타자처럼
 const s2=t>=2.45&&t<5.15;['w1','w2','w3'].forEach(i=>vis(i,s2));
 if(s2){const a=sp(t-2.5,15,.6);$('w1').style.transform=`scale(${mix(1.3,1,a)})`;$('w2').style.opacity=cl((t-2.5)/.15);
  const n=Math.floor(cl((t-2.6)/.7)*DEF.length);let s=DEF.slice(0,n).replace('매력과 표현','<span style="color:#FF4F9A">매력과 표현</span>');
  if(s.includes('매력과 표')&&!s.includes('</span>'))s=s.replace(/매력과 표?현?$/,m=>`<span style="color:#FF4F9A">${m}</span>`);
  $('w3').innerHTML=s.replace(/\n/g,'<br>')+(n<DEF.length&&Math.floor(t*4)%2?'|':'')}
 tiles(t,4.9,BK);
 // 3 구조도: 띠 묶음 → 도화 글자
 const s3=t>=5.15&&t<9.95;vis('h1',s3);
 if(s3){$('h1').style.transform=`scale(${mix(1.2,1,sp(t-5.2,15,.6))})`;tree(t,5.35)}
 tiles(t,9.7,GY);
 // 4 링네개: 2027 도화 달
 const s4=t>=9.95&&t<12.65;['m1','m2','m3'].forEach(i=>vis(i,s4));
 if(s4){$('m1').style.transform=`scale(${mix(1.2,1,sp(t-10,15,.6))})`;rings(t,10.3);$('m3').style.opacity=1}
 tiles(t,12.4,PK);
 // 5 끝
 const s5=t>=12.65;['f1','f2','f3'].forEach(i=>vis(i,s5));
 if(s5){const a=sp(t-12.7,15,.62);$('f1').style.transform=`scale(${mix(1.3,1,a)})`;$('f2').style.opacity=cl((t-13.1)/.2);const b=sp(t-13.4,15,.6);$('f3').style.transform=`scale(${t>=14.3&&t<14.45?.94:b})`;$('f3').style.opacity=t>=13.4?1:0}
}
(async()=>{await document.fonts.load('900 100px PL');await document.fonts.load('800 40px PR');window.seek=t=>{draw0(t);const p=g.getImageData(4,4,1,1).data;document.body.style.background=`rgb(${p[0]},${p[1]},${p[2]})`;const fr=document.getElementById('zsfr').getContext('2d');fr.clearRect(0,0,1080,1920);FXK.frame(fr,{ai:'AI가 계산·작성한 콘텐츠예요'})};seek(0)})();
</script><canvas id="zsfr" width="1080" height="1920" style="position:absolute;left:0;top:0;z-index:99;pointer-events:none"></canvas></body></html>
