<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#102A43}canvas{position:absolute;inset:0}</style></head><body><canvas id="cv" width="1080" height="1920"></canvas>
<script src="../../pipeline/motion_fx.js"></script><script>
// 시안 A(대표 확인용, 발행·예약 안 함) · 11/17 ① 자동 · CT 11/16 21:4x 요청 "12월, 힘이 실리는 띠는? 내 띠를 찾아보세요"
// 틀: 터진 사주 쇼츠처럼 리스트·격자 한 장, 시청자가 내 띠를 찾는 행동. 이 편이 '첫 줄 질문형' 비교 편(K-107 대비 한 편만).
// 값은 엔진 계산만: 2026-12-07 11:52 대설부터 子월(engine.get_solar_terms_kst). 子와 육합=丑(소), 삼합 申子辰=원숭이·용, 같은 글자=쥐, 충=午(말) — engine/dapjang_zodiac HAP·SAM·CHUNG.
// 판 v_navy(미드나잇 네이비 #102A43 + 소프트 버터 #FFF3C4). 정월 없음(K-197), 화면에 한자 없음, 돈·건강 말 없음(K-217).
window.FX=['글자스태거','격자불켜기','칩흔들기','원와이프'];
const F=FXK,{cl,mix,ease,eio,sp}=F,BG='#102A43',BG2='#1C3A55',BT='#FFF3C4',SL='#6F86A3',g=document.getElementById('cv').getContext('2d');
window.SFX=[{t:.05,k:'press'},{t:.2,k:'pop'},{t:.35,k:'tick'},{t:1.75,k:'swoosh'},{t:2.5,k:'ding'},{t:3.7,k:'ding'},{t:3.85,k:'ding'},{t:4.9,k:'ding'},{t:6.1,k:'thud'},{t:7.3,k:'swoosh'},{t:8.2,k:'press'},{t:9.0,k:'chime'}];
function T(txt,x,y,font,color,align='center'){g.font=font;g.fillStyle=color;g.textAlign=align;g.textBaseline='middle';g.fillText(txt,x,y)}
function fade(t,a,b){return cl((t-a)/.25)*cl((b-t)/.25)}
const ANI=['쥐','소','호랑이','토끼','용','뱀','말','양','원숭이','닭','개','돼지'];
// 켜지는 순서(시각) — 육합 → 삼합 → 같은 글자 → 충
const ON={1:2.5,4:3.7,8:3.85,0:4.9}, WARN={6:6.1};
const SAY=[[1.8,'내 띠는 어디 있을까?'],[2.4,'소는 쥐와 짝이에요'],[3.6,'용·원숭이는 쥐와 한 팀이에요'],[4.8,'쥐띠는 내 띠의 달이에요'],[6.0,'말띠는 정면으로 부딪혀요']];
const CW=244,CH=120,GX=54,GY=56,X0=F.cx-(3*CW+2*GX)/2,Y0=581;
function grid(t){
 T('12월 7일 대설부터 쥐의 달',F.cx,495,'900 72px PL',BT);
 ANI.forEach((nm,i)=>{const c=i%3,r=Math.floor(i/3),x=X0+c*(CW+GX),y=Y0+r*(CH+GY);
  const b=sp(t-1.8-i*.03,15,.6);if(b<=0)return;g.save();g.translate(x+CW/2,y+CH/2);g.scale(b,b);
  const on=ON[i]!==undefined&&t>=ON[i],w=WARN[i]!==undefined&&t>=WARN[i];
  let dx=0;if(w){const u=t-WARN[i];dx=Math.sin(u*40)*Math.exp(-u*6)*18}
  const k=on?eio(cl((t-ON[i])/.25)):0;
  g.fillStyle=on?BT:BG2;g.beginPath();g.roundRect(-CW/2+dx,-CH/2,CW,CH,30);g.fill();
  if(on&&k<1){g.fillStyle=BG2;g.beginPath();g.roundRect(-CW/2,-CH/2,CW*(1-k),CH,30);g.fill()}
  T(w?nm+' 조심':nm,dx,3,'900 60px PL',on?BG:(w?BT:SL));g.restore()});
 let cur=null;SAY.forEach(s=>{if(t>=s[0])cur=s});
 if(cur){const a=sp(t-cur[0],14,.6);g.save();g.globalAlpha=cl(a*2);T(cur[1],F.cx,1317-(1-a)*30,'900 60px PL',BT);g.restore()}
}
function draw(t){g.fillStyle=BG;g.fillRect(0,0,1080,1920);
 // 1 훅 — 질문형
 if(t<1.9){const a=cl((1.9-t)/.25);g.save();g.globalAlpha=a;
  const s1=sp(t+.25,14,.6);g.save();g.translate(F.cx,625);g.scale(s1,s1);T('12월에',0,0,'900 120px PL',BT);g.restore();
  if(t>.15){const s2=sp(t-.15,14,.6);g.save();g.translate(F.cx,890);g.scale(s2,s2);T('힘이 실리는 띠는?',0,0,'900 112px PL',BT);g.restore()}
  if(t>.3){const s3=sp(t-.3,14,.6);g.save();g.translate(F.cx,1173);g.scale(s3,s3);g.fillStyle=BT;g.beginPath();g.roundRect(-330,-70,660,140,70);g.fill();T('내 띠를 찾아보세요',0,2,'900 60px PL',BG);g.restore()}
  g.restore()}
 // 2 격자
 if(t>=1.7&&t<7.5){g.save();g.globalAlpha=fade(t,1.7,7.5);grid(t);g.restore()}
 // 3 마무리
 if(t>=7.3){const a=cl((t-7.3)/.25);g.save();g.globalAlpha=a;
  const s=sp(t-7.4,14,.6);g.save();g.translate(F.cx,700);g.scale(s,s);T('같은 띠라도',0,0,'900 96px PL',BT);T('태어난 날마다 달라요',0,130,'900 96px PL',BT);g.restore();
  const b=sp(t-8.2,14,.6);g.save();g.translate(F.cx,1150);g.scale(b,b);g.fillStyle=BT;g.beginPath();g.roundRect(-405,-70,810,140,70);g.fill();T('생일만 넣으면 무료 판정 →',0,-2,'900 60px PL',BG);g.restore();
  g.restore()}
 F.frame(g,{ai:'AI가 계산·작성한 콘텐츠예요'});
}
(async()=>{await window.__zsFonts;for(const f of ['900 100px PL','800 40px PR'])await document.fonts.load(f);window.coverT=3;
window.seek=draw;draw(0)})();
</script></body></html>
