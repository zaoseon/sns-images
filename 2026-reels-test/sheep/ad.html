<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:PL;src:url(../../pipeline/fonts/Paperlogy-9Black.ttf)}@font-face{font-family:PR;src:url(../../pipeline/fonts/PRETENDARD-EXTRABOLD.OTF)}
@font-face{font-family:HP;src:url(../../pipeline/fonts/NanumPenScript-Regular.ttf)}@font-face{font-family:HC;src:url(../../pipeline/fonts/Gaegu-Bold.ttf)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#163C32}canvas{position:absolute;inset:0}</style></head><body><canvas id="cv" width="1080" height="1920"></canvas>
<script src="../../pipeline/motion_fx.js"></script><script>
window.FX=['캐릭터등장','캐릭터말하기','손글씨말풍선','스티커테두리','원형배치','칩줄세우기','도형격자변형','손글씨주석','회전별표'];
const F=FXK,{cl,mix,ease,eio,sp}=F,G='#163C32',GD='#C7A34A',IV='#F8F3E8',g=document.getElementById('cv').getContext('2d');let C1,C2,C3;
const AN=['쥐','소','호랑이','토끼','용','뱀','말','양','원숭이','닭','개','돼지'];
window.SFX=[{t:.15,k:'whoosh'},{t:.55,k:'pop'},{t:1.7,k:'pop'},{t:3,k:'whoosh'},...Array.from({length:14},(_,i)=>({t:3.2+Math.pow(i/14,1.6)*2,k:'tick'})),{t:5.25,k:'sparkle'},{t:5.3,k:'ding'},
 {t:6.3,k:'swoosh'},...[0,1,2,3,4].map(i=>({t:6.5+i*.12,k:'pop'})),{t:7.5,k:'boing'},{t:8.6,k:'whoosh'},{t:9.6,k:'cash'},{t:10.5,k:'thud'},{t:12,k:'whoosh'},{t:12.4,k:'pop'},{t:13.4,k:'pop'},{t:14.2,k:'ding'}];
function T(txt,x,y,font,color,align='center'){g.font=font;g.fillStyle=color;g.textAlign=align;g.textBaseline='middle';g.fillText(txt,x,y)}
function draw(t){const X=F.cx;g.fillStyle=G;g.fillRect(0,0,1080,1920);
 for(let i=0;i<40;i++){g.fillStyle='rgba(199,163,74,.10)';g.beginPath();g.arc(F.H(i)*1080,F.H(i+5)*1920+Math.sin(t+i)*6,3+F.H(i+9)*5,0,7);g.fill()}
 let jw=false;
 // 1 정월 등장 + 말풍선 (얼굴은 안전 영역 안, 몸은 아래로 흘러도 된다)
 if(t<3.1){jw=true;F.character(g,t,{imgs:[C1,C2],x:660,y:1920,h:1120,enter:.1,exit:2.75,talk:[[.5,2.6]]});
  F.bubble(g,t,.55,{text:'양띠 친구들\n잠깐만!!',x:300,y:560,tx:430,font:'96px BZ'});
  if(t>1.7)F.bubble(g,t,1.7,{text:'2027년은\n우리 해야',x:290,y:900,tx:420,font:'78px BZ',bg:GD,color:'#111',pad:38})}
 // 2 띠 룰렛 → 양
 if(t>=3&&t<6.3){const p=ease(cl((t-3.2)/2.05)),rot=-(7*Math.PI/6)-Math.PI*4*(1-p),a=sp(t-3,12,.7)*(t>6?cl((6.3-t)/.3):1);
  g.save();g.translate(X,860);g.scale(a,a);g.rotate(rot);g.strokeStyle='rgba(248,243,232,.25)';g.lineWidth=4;g.beginPath();g.arc(0,0,300,0,7);g.stroke();
  AN.forEach((n,i)=>{const an=-Math.PI/2+i*Math.PI/6,x=Math.cos(an)*300,y=Math.sin(an)*300,hit=i==7&&t>5.25,s=hit?1+.15*sp(t-5.25,14,.5):1;g.save();g.translate(x,y);g.rotate(-rot);g.scale(s,s);
   g.fillStyle=hit?GD:IV;g.beginPath();g.arc(0,0,64,0,7);g.fill();T(n,0,3,`900 ${n.length>2?36:44}px PL`,'#163C32');g.restore()});g.restore();
  g.fillStyle=GD;g.beginPath();g.moveTo(X,500);g.lineTo(X-28,446);g.lineTo(X+28,446);g.fill();
  if(t>5.3){const b=sp(t-5.3,15,.6)*(t>6?cl((6.3-t)/.3):1);g.save();g.translate(X,1330);g.scale(b,b);T('내 띠가 돌아오는 해',0,0,'900 80px PL',IV);g.restore()}}
 // 3 나이표
 if(t>=6.3&&t<8.7){T('양띠는 몇 년생?',X,560,'900 88px PL',IV);const P=F.chips(g,t,6.5,{labels:['1967','1979','1991','2003','2015'],y:700,font:'900 62px PL',bg:IV,fg:G,gap:26});
  F.annot(g,t,7.4,{from:[P[4][0]+60,P[4][1]+300],to:[P[4][0]+20,P[4][1]+70],text:'나 여기!',color:GD,font:'88px BZ'})}
 // 4 달력
 if(t>=8.6&&t<12.1){T('2027 양띠 달력',X,480,'900 80px PL',IV);const gx=X-300,gy=640,d=200;
  F.shapeGrid(g,t,8.7,{cols:4,rows:3,x0:gx,y0:gy,dx:d,dy:d,s:74,seq:['circle','square'],color:'#24584A',labels:[...Array(12)].map((_,i)=>(i+1)+'월'),font:'900 42px PL',fg:IV});
  if(t>9.6){[2,5,10].forEach((i,k)=>{const s=sp(t-9.6-k*.12,15,.55),x=gx+(i%4)*d,y=gy+Math.floor(i/4)*d;g.save();g.translate(x,y);g.scale(s,s);g.fillStyle=GD;g.beginPath();g.roundRect(-84,-84,168,168,38);g.fill();T((i+1)+'월',0,3,'900 46px PL','#111');g.restore()})}
  if(t>10.5){[11].forEach((i,k)=>{const p=cl((t-10.5-k*.15)/.25),x=gx+(i%4)*d,y=gy+Math.floor(i/4)*d;g.strokeStyle='#E07A5F';g.lineWidth=12;g.lineCap='round';g.beginPath();g.moveTo(x-56,y-56);g.lineTo(x-56+112*p,y-56+112*p);g.stroke()})}
  if(t>10)T('힘 쓸 달 3·6·11월',X,1215,'124px DK',GD);if(t>10.8)T('아낄 달 12월·이듬해 1월',X,1345,'112px DK','#F2B5A3')}
 // 5 정월 다시 + 행동
 if(t>=12){jw=true;F.character(g,t,{imgs:[C3,C2],x:680,y:1920,h:1060,enter:12,talk:[[12.4,14]],from:'right'});
  F.bubble(g,t,12.4,{text:'주변 양띠\n태그해 줘~',x:300,y:580,tx:440,font:'96px BZ'});
  const b=sp(t-13.4,14,.6);g.save();g.translate(300,930);g.scale(b*(t>14.2&&t<14.35?.94:1),b);g.fillStyle=GD;g.beginPath();g.roundRect(-230,-62,460,124,62);g.fill();T('다른 띠는 아래 링크',0,3,'900 44px PL','#111');g.restore();
  F.asterisk(g,t,{x:110,y:1300,r:46,color:GD})}
 F.frame(g,{ai:jw?'정월은 가상의 AI 캐릭터입니다':'AI가 계산·작성한 콘텐츠예요'});
}
(async()=>{await window.__zsFonts;for(const f of ['900 100px PL','800 40px PR','60px BZ','60px DK'])await document.fonts.load(f);
 const [a,b,c]=await Promise.all(['v2_straight','v8_gesture','v1_lowbun'].map(n=>F.img('../../characters/cut/'+n+'.png')));C1=F.sticker(a,{px:9});C2=F.sticker(b,{px:9});C3=F.sticker(c,{px:9});window.seek=draw;draw(0)})();
</script></body></html>
