<!doctype html><html><head><meta charset="utf-8">
<!-- 11/18 17:00 인스타 릴스 실험 칸 · 형식 B(진짜 숫자 데이터 모션) · 일간 갑(甲)
     글: 2026-ilgan3/build.py REELS gab 문장 그대로(훅·둘째 줄·기운·까닭·해 볼 것). 새 문장은 숫자 장면 한 줄과 끝 장면뿐.
     숫자 근거: 태어난 날 첫 글자(일간)는 甲~癸 열 가지가 날마다 차례로 돈다 → 열 명 중 한 명꼴(지어낸 통계 아님).
     정월 없음(K-197). 글 칸 x 50~900(가운데 FXK.cx), y 450~1415. -->
<style>
@font-face{font-family:PL;src:url(../../pipeline/fonts/Paperlogy-9Black.ttf)}
@font-face{font-family:PR;src:url(../../pipeline/fonts/PRETENDARD-EXTRABOLD.OTF)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0F3D2E}
#s{position:absolute;inset:0;overflow:hidden}canvas{position:absolute;inset:0}
.t{position:absolute;left:50px;right:180px;text-align:center;white-space:nowrap}
</style></head><body><div id="s"><canvas id="cv" width="1080" height="1920"></canvas>
<div id="a1" class="t" style="top:670px;font:900 150px/1.1 PL;color:#fff;letter-spacing:-4px">시작은 늘</div>
<div id="a2" class="t" style="top:850px;font:900 150px/1.1 PL;color:#FFC21A;letter-spacing:-4px">내가 먼저 해요</div>
<div id="a3" class="t" style="top:1110px;font:800 64px PR;color:#E8F5EE">누가 안 하면 결국 내가 해요</div>
<div id="b1" class="t" style="top:455px;font:800 64px PR;color:#E8F5EE">태어난 날 첫 글자</div>
<div id="b2" class="t" style="top:1060px;font:900 92px PL;color:#fff">열 글자 중 <b id="b2k" style="color:#FFC21A">하나</b></div>
<div id="b3" class="t" style="top:1200px;font:800 64px PR;color:#E8F5EE">열 명 중 <b style="color:#FFC21A">한 명</b>꼴이에요</div>
<div id="c1" class="t" style="top:470px;font:900 110px/1.15 PL;color:#fff">곧게 뻗는<br><span style="color:#FFC21A">큰 나무</span> 기운</div>
<div id="d1" class="t" style="top:480px;font:900 104px/1.18 PL;color:#fff">앞장서는 만큼<br><span style="color:#FFC21A">혼자 지칠 때</span>가<br>많아요</div>
<div id="d2" class="t" style="top:1290px;font:800 60px PR;color:#E8F5EE">남은 힘 <b id="d2n" style="font:900 76px PL;color:#FFC21A">100</b>%</div>
<div id="e1" class="t" style="top:560px;font:900 104px/1.18 PL;color:#fff">쉬는 시간을<br><span style="color:#FFC21A">일정에 먼저</span><br>넣어 보세요</div>
<div id="f1" class="t" style="top:640px;font:900 120px/1.18 PL;color:#0F3D2E">내 첫 글자도<br>갑일까?</div>
<div id="f2" class="t" style="top:960px;font:800 64px PR;color:#0F3D2E">생일만 넣으면 무료 판정</div>
<div id="f3" class="t" style="top:1080px;left:140px;right:270px;height:150px;border-radius:999px;background:#0F3D2E;color:#FFC21A;font:900 66px/150px PL">프로필 링크 ↗</div>
</div>
<script src="../../pipeline/motion_fx.js"></script>
<script>
window.FX=['슬롯롤링','점파동','궤적선','게이지빼기','블록꽂기','원와이프'];
const {cl,mix,ease,eio,sp}=FXK,GN='#0F3D2E',GN2='#16523E',Y='#FFC21A',W='#FFFFFF',MINT='#E8F5EE';
const $=id=>document.getElementById(id),g=$('cv').getContext('2d'),vis=(id,on)=>$(id).style.display=on?'':'none';
window.SFX=[{t:.3,k:'press'},{t:.9,k:'press'},{t:1.5,k:'tick'},{t:2.6,k:'swoosh'},{t:3.0,k:'tick'},{t:3.3,k:'tick'},{t:3.6,k:'tick'},{t:4.1,k:'chime'},{t:4.6,k:'press'},
 {t:5.6,k:'swoosh'},{t:6.0,k:'tick'},{t:6.6,k:'tick'},{t:7.2,k:'chime'},{t:8.3,k:'swoosh'},{t:9.2,k:'tick'},{t:10.2,k:'tick'},{t:11.1,k:'swoosh'},{t:12.0,k:'press'},
 {t:13.2,k:'swoosh'},{t:13.7,k:'chime'},{t:14.3,k:'press'}];
const GAN=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
function slot(t,t0,t1){const n=10,total=2*n,p=t>=t1?1:eio(cl((t-t0)/(t1-t0)));let pos=p*total;if(t>=t1)pos=total-Math.sin((t-t1)*18)*Math.exp(-(t-t1)*7)*.15;
 const y=800,h=320;g.save();g.beginPath();g.rect(0,600,1080,400);g.clip();g.font='900 230px PL';g.textAlign='center';g.textBaseline='middle';g.fillStyle='#fff';
 for(let k=Math.floor(pos);k<=Math.floor(pos)+1;k++){const off=(k-pos)*h;if(Math.abs(off)>=h*.55)continue;g.fillText(GAN[((k%n)+n)%n],FXK.cx,y+off)}g.restore()}
function pop(id,t0,t,k=15,z=.6){const a=sp(t-t0,k,z);$(id).style.transform=`scale(${a})`;$(id).style.opacity=t>=t0?1:0}
function rise(id,t0,t){const a=sp(t-t0,14,.7);$(id).style.transform=`translateY(${(1-a)*90}px)`;$(id).style.opacity=cl((t-t0)/.12)}
function wipe(t,t0,col,y=1060){if(t>=t0&&t<t0+.42){g.fillStyle=col;g.beginPath();g.arc(FXK.cx,y,eio((t-t0)/.42)*1500,0,7);g.fill()}}
function tree(t,t0,cx,base){ // 나무가 위로 자람: 줄기 → 가지 → 잎
 const p=eio((t-t0)/1.0);if(p<=0)return;g.save();g.lineCap='round';g.strokeStyle='#8B5E34';g.lineWidth=34;
 const top=base-mix(0,330,p);g.beginPath();g.moveTo(cx,base);g.lineTo(cx,top);g.stroke();
 const br=[[.45,-1],[.62,1],[.78,-1],[.9,1]];g.lineWidth=16;
 br.forEach(([h,s],i)=>{const q=eio((t-t0-.45-i*.12)/.4);if(q<=0)return;const y=base-330*h;g.beginPath();g.moveTo(cx,y);g.lineTo(cx+s*130*q,y-90*q);g.stroke()});
 const L=[[0,-360,120],[-120,-290,90],[120,-250,90],[-80,-400,80],[90,-410,80],[-150,-200,70],[150,-170,70]];
 L.forEach(([dx,dy,r],i)=>{const q=sp(t-t0-.9-i*.07,14,.6);if(q<=0)return;g.fillStyle=i%2?'#2EBD6B':'#3FD483';g.beginPath();g.arc(cx+dx,base+dy,r*q,0,7);g.fill()});
 g.restore()}
function draw0(t){
 let bg=GN; if(t>=13.2)bg=Y; g.fillStyle=bg;g.fillRect(0,0,1080,1920);
 // 1 훅(0초부터 글자 다 보임, K-139)
 const s1=t<2.6;['a1','a2','a3'].forEach(i=>vis(i,s1));
 if(s1){const a=sp(t+.25,16,.55),b=sp(t+.1,16,.55);$('a1').style.transform=`scale(${mix(.86,1,a)})`;$('a2').style.transform=`scale(${mix(.8,1,b)}) rotate(${mix(-3,0,b)}deg)`;
  $('a3').style.opacity=cl((t-1.4)/.2);$('a3').style.transform=`translateY(${(1-sp(t-1.4,14,.7))*60}px)`;
  FXK.trail(g,t,.4,1.6,u=>[mix(120,830,u),1055+Math.sin(u*Math.PI)*-20],{color:Y,r:10})}
 // 2 열 글자 슬롯 → 갑에서 멈춤 + 열 명 점
 wipe(t,2.45,GN2);const s2=t>=2.6&&t<5.5;['b1','b2','b3'].forEach(i=>vis(i,s2));
 if(s2){g.fillStyle=GN2;g.fillRect(0,0,1080,1920);$('b1').style.opacity=cl((t-2.65)/.15);
  g.save();g.fillStyle='rgba(0,0,0,.22)';g.beginPath();g.roundRect(FXK.cx-200,600,400,400,56);g.fill();g.restore();
  slot(t,2.7,4.1);
  if(t>=4.1){const q=sp(t-4.1,16,.5);g.save();g.strokeStyle=Y;g.lineWidth=10;g.beginPath();g.roundRect(FXK.cx-200-8*q,600-8*q,400+16*q,400+16*q,60);g.stroke();g.restore()}
  rise('b2',2.85,t);rise('b3',3.0,t);$('b2k').textContent=t>=4.15?'갑':'하나';if(t>=4.15){const a=sp(t-4.15,15,.5);$('b2k').style.display='inline-block';$('b2k').style.transform=`scale(${mix(1.6,1,a)})`}
  // 열 명 점: 한 명만 금색
  if(t>=2.9){for(let i=0;i<10;i++){const q=sp(t-2.9-i*.04,15,.6),x=FXK.cx-382+i*85,y=1380;g.fillStyle=i==0&&t>=4.15?Y:'rgba(255,255,255,.35)';g.beginPath();g.arc(x,y,26*q,0,7);g.fill()}}}
 // 3 큰 나무 기운: 점 물결 위로 나무가 자람
 wipe(t,5.35,GN);const s3=t>=5.5&&t<8.3;vis('c1',s3);
 if(s3){FXK.dotwave(g,t,5.5,{cols:11,rows:9,x0:FXK.cx-400,y0:780,gap:80,centers:[[FXK.cx,1360]],color:'rgba(255,255,255,.16)',r0:4,amp:7});
  rise('c1',5.55,t);tree(t,5.9,FXK.cx,1380)}
 // 4 까닭: 배터리가 빠짐 100 → 15
 wipe(t,8.15,GN2);const s4=t>=8.3&&t<11.1;['d1','d2'].forEach(i=>vis(i,s4));
 if(s4){g.fillStyle=GN2;g.fillRect(0,0,1080,1920);rise('d1',8.35,t);$('d2').style.opacity=cl((t-8.7)/.15);
  const p=eio((t-9)/1.6),v=Math.round(mix(100,15,p));$('d2n').textContent=v;
  const bx=FXK.cx-260,by=1010,bw=480,bh=220;g.save();g.strokeStyle='#fff';g.lineWidth=14;g.beginPath();g.roundRect(bx,by,bw,bh,36);g.stroke();
  g.fillStyle='#fff';g.beginPath();g.roundRect(bx+bw+12,by+70,34,80,12);g.fill();
  const fw=(bw-44)*v/100;g.fillStyle=v>30?'#3FD483':'#FF5A1F';g.beginPath();g.roundRect(bx+22,by+22,Math.max(fw,8),bh-44,22);g.fill();
  if(v<=30){const k=Math.sin((t-10)*22)*6*cl(1-(t-10.6));g.translate(k,0)}g.restore()}
 // 5 해 볼 것: 일주일 칸에 '쉼' 블록을 먼저 꽂음
 wipe(t,10.95,GN);const s5=t>=11.1&&t<13.2;vis('e1',s5);
 if(s5){rise('e1',11.15,t);const days=['월','화','수','목','금'],bw=131,cw=bw+48,x0=FXK.cx-(5*cw-48)/2,y0=1180,bh=200,busy=[0,1,3,4];
  g.save();g.font='800 60px PR';g.textAlign='center';g.textBaseline='middle';
  days.forEach((d,i)=>{const q=sp(t-11.3-i*.04,15,.7);if(q<=0)return;const x=x0+i*cw;const on=i==2&&t>=12.2;
   g.fillStyle=on?Y:(busy.includes(i)?'rgba(255,255,255,.5)':'rgba(255,255,255,.14)');g.beginPath();g.roundRect(x,y0,bw,bh*q,18);g.fill();g.fillStyle=MINT;g.fillText(d,x+bw/2,y0-85);
   if(i==2){g.fillStyle=on?GN:Y;g.font='900 60px PL';g.fillText('쉼',x+bw/2,y0+bh/2+2);g.font='800 60px PR'}});
  g.restore()}
 // 6 끝
 wipe(t,13.0,Y);const s6=t>=13.2;['f1','f2','f3'].forEach(i=>vis(i,s6));
 if(s6){const a=sp(t-13.2,15,.62);$('f1').style.transform=`scale(${mix(1.3,1,a)})`;$('f2').style.opacity=cl((t-13.6)/.2);pop('f3',13.9,t);
  if(t>=14.3&&t<14.45)$('f3').style.transform='scale(.94)';
  FXK.trail(g,t,14,1.0,u=>{const a=-Math.PI/2+u*6.6;return[FXK.cx+Math.cos(a)*400,1300+Math.sin(a)*60]},{color:GN,loop:true,r:12})}
}
(async()=>{await document.fonts.load('900 100px PL');await document.fonts.load('800 40px PR');window.seek=t=>{draw0(t);const p=g.getImageData(4,4,1,1).data;document.body.style.background=`rgb(${p[0]},${p[1]},${p[2]})`;const fr=document.getElementById('zsfr').getContext('2d');fr.clearRect(0,0,1080,1920);FXK.frame(fr,{ai:'AI가 계산·작성한 콘텐츠예요'})};seek(0)})();
</script><canvas id="zsfr" width="1080" height="1920" style="position:absolute;left:0;top:0;z-index:99;pointer-events:none"></canvas></body></html>
