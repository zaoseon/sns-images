<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0E2A47}canvas{position:absolute;inset:0}</style></head><body><canvas id="cv" width="1080" height="1920"></canvas>
<script src="../../pipeline/motion_fx.js"></script><script>
// 11/16 17:00 릴스 실험 F(1·2 고르기 퀴즈) + 정월 — 임·계(물 기운 일간). 문장은 11/16 예약 캡션·11/1 승인 스레드(412816564·412816569) 그대로.
window.FX=['글자튀기','알약띠','물결링','점착지','글자스태거','박자글자','카메라줌'];
const F=FXK,{cl,mix,ease,eio,sp}=F,BG='#0E2A47',AQ='#6FD3E0',IV='#F8F3E8',YL='#FFD93D',g=document.getElementById('cv').getContext('2d');let C1,C2,C3;
window.SFX=[{t:.15,k:'whoosh'},{t:.5,k:'pop'},{t:.75,k:'pop'},{t:3.05,k:'whoosh'},{t:3.3,k:'pop'},{t:3.42,k:'pop'},{t:3.5,k:'chime'},{t:3.6,k:'ding'},
 {t:6.75,k:'swoosh'},{t:7.0,k:'tick'},{t:7.25,k:'tick'},{t:7.5,k:'tick'},{t:7.75,k:'tick'},{t:7.6,k:'ding'},
 {t:10.3,k:'whoosh'},{t:10.6,k:'pop'},{t:10.75,k:'pop'},{t:11.6,k:'tick'},{t:12.1,k:'tick'},{t:12.6,k:'tick'},{t:13.1,k:'whoosh'},{t:13.4,k:'pop'},{t:14.2,k:'ding'}];
function T(txt,x,y,font,color,align='center'){g.font=font;g.fillStyle=color;g.textAlign=align;g.textBaseline='middle';g.fillText(txt,x,y)}
function fade(t,a,b){return cl((t-a)/.25)*cl((b-t)/.25)}
function card(x,y,w,h,s,bg,big,sub,fg='#0E2A47'){g.save();g.translate(x,y);g.scale(s,s);g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.roundRect(-w/2+8,-h/2+12,w,h,44);g.fill();
 g.fillStyle=bg;g.beginPath();g.roundRect(-w/2,-h/2,w,h,44);g.fill();T(big,0,-h*.16,'900 160px PL',fg);T(sub,0,h*.25,'900 76px PL',fg);g.restore()}
function draw(t){const X=F.cx;g.fillStyle=BG;g.fillRect(0,0,1080,1920);
 // 배경: 천천히 내려오는 물방울 점
 for(let i=0;i<46;i++){const y=((F.H(i+3)*1920+t*(40+F.H(i)*60))%1960)-20;g.fillStyle='rgba(111,211,224,.13)';g.beginPath();g.arc(F.H(i)*1080,y,3+F.H(i+9)*6,0,7);g.fill()}
 let jw=false;
 // 1 정월 + 훅
 if(t<3.1){const o=cl((3.05-t)/.3);g.save();g.globalAlpha=o;   // 11/12 대표 '정월 나오는 거 어색' → 영상에서 뺌(K-197). 훅은 글자만
  const a1=sp(t-.15,14,.6);g.save();g.translate(X,F.cy-170);g.scale(a1,a1);T('말 없는 친구,',0,0,'900 104px PL',IV);T('다 듣고 있어요',0,130,'900 104px PL',IV);g.restore();
  if(t>.7){const a2=sp(t-.7,15,.55);g.save();g.translate(X,F.cy+215);g.scale(a2,a2);g.fillStyle=AQ;g.beginPath();g.roundRect(-370,-86,740,172,86);g.fill();T('판단은 벌써 끝났을걸요?',0,4,'900 68px PL','#0E2A47');g.restore()}
  g.restore()}
 // 2 임 — 큰 물: 물결링 + 글자 스태거
 if(t>=3&&t<6.9){const a=fade(t,3,6.9),z=1+.06*ease(cl((t-3)/3.9));g.save();g.globalAlpha=a;g.translate(X,860);g.scale(z,z);g.translate(-X,-860);
  F.ripples(g,t,3.1,{x:X,y:860,n:6,color:'111,211,224',core:AQ});
  g.fillStyle=AQ;g.beginPath();g.arc(X,860,170*sp(t-3.2,13,.6),0,7);g.fill();window.__zsLoose=1;T('임',X,866,'900 190px PL','#0E2A47');window.__zsLoose=0;
  F.stagger(g,t,3.35,{word:'태어난 날 첫 글자',x:X,y:520,font:'900 66px PL',color:IV});
  if(t>3.5)T('큰 물 같은 기운',X,1180,'900 84px PL',IV);
  if(t>3.6){const b=sp(t-3.6,15,.6);g.save();g.translate(X,1300);g.scale(b,b);T('조용히 듣고, 판단은 먼저',0,0,'900 72px PL',YL);g.restore()}
  g.restore()}
 // 3 계 — 스며드는 비: 물방울이 떨어져 찌그러짐(점착지)
 if(t>=6.7&&t<10.4){const a=fade(t,6.7,10.4);g.save();g.globalAlpha=a;
  T('계',X,655,'900 170px PL',AQ);
  [0,1,2,3].forEach(i=>F.dotLand(g,t,6.95+i*.25,{x:X-240+i*160,y:945,r:30,color:i==3?YL:AQ,h:300}));
  g.fillStyle='rgba(111,211,224,.35)';g.fillRect(X-330,1015,660,8);
  if(t>6.9)T('스며드는 비 같은 기운',X,1125,'900 80px PL',IV);
  if(t>7.6){const b=sp(t-7.6,15,.6);g.save();g.translate(X,1230);g.scale(b,b);T('분위기 가라앉은 걸',0,0,'900 78px PL',YL);T('제일 먼저 알아채요',0,90,'900 78px PL',YL);g.restore()}
  g.restore()}
 // 4 1·2 고르기 — 두 장이 번갈아 커짐
 if(t>=10.3&&t<13.2){const a=fade(t,10.3,13.2),A=F.area(),w=390,h=450,gx=(A.x1-A.x0-2*w)/3;g.save();g.globalAlpha=a;
  T('나는 어느 쪽?',X,520,'900 100px PL',IV);
  const on=t>11.4?Math.floor((t-11.4)/.5)%2:-1;
  [['1','듣는 쪽',AQ],['2','말하는 쪽',IV]].forEach(([n,s,c],i)=>{const s0=sp(t-10.5-i*.15,15,.55)*(on==i?1.07:1);card(A.x0+gx+w/2+i*(w+gx),900,w,h,s0,c,n,s)});
  if(t>11.2){const b=sp(t-11.2,15,.6);g.save();g.translate(X,1290);g.scale(b,b);T('댓글에 숫자 하나만!',0,0,'900 82px PL',YL);g.restore()}g.restore()}
 // 5 정월 + 행동
 if(t>=13){const a5=sp(t-13.2,14,.6);g.save();g.translate(X,F.cy-120);g.scale(a5,a5);T('나는 1번!',0,0,'900 120px PL',IV);T('너는 몇 번?',0,150,'900 120px PL',AQ);g.restore();
  const b=sp(t-14.1,14,.6);g.save();g.translate(X,F.cy+230);g.scale(b,b);g.fillStyle=YL;g.beginPath();g.roundRect(-410,-66,820,132,66);g.fill();T('내 첫 글자는 프로필 링크에서',0,-2,'900 60px PL','#111');g.restore()}
 F.frame(g,{ai:'AI가 계산·작성한 콘텐츠예요'});
}
(async()=>{await window.__zsFonts;for(const f of ['900 100px PL','800 40px PR'])await document.fonts.load(f);window.seek=draw;draw(0)})();
</script></body></html>
