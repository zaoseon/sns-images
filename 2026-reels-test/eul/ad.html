<!doctype html><html><head><meta charset="utf-8">
<!-- 11/19 17:00 인스타 릴스 실험 칸 · 형식 E(카톡 대화 모션) · 일간 을(乙)
     글: 2026-ilgan3/build.py REELS eul 문장 그대로(훅·둘째 줄·기운·까닭·해 볼 것). 새 문장은 카톡 대화 몇 마디와 끝 장면뿐.
     카톡은 훅('싫다는 말 대신 다른 길로 돌아가요')을 장면으로 보여 주는 예시 대화 — 숫자·통계 없음.
     정월 없음(K-197). 판 v_emerald(#004D40 + 라일락 #EFE5FD, 3회차 을 판 그대로). 글 칸 x 50~900(가운데 FXK.cx), y 450~1365.
     카톡 말풍선은 보이는 것끼리 묶어 늘 칸 세로 가운데에 앉힌다(K-203 균형). -->
<style>
@font-face{font-family:PL;src:url(../../pipeline/fonts/Paperlogy-9Black.ttf)}
@font-face{font-family:PR;src:url(../../pipeline/fonts/PRETENDARD-EXTRABOLD.OTF)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#004D40}
#s{position:absolute;inset:0;overflow:hidden}canvas{position:absolute;inset:0}
.t{position:absolute;left:50px;right:180px;text-align:center;white-space:nowrap}
</style></head><body><div id="s"><canvas id="cv" width="1080" height="1920"></canvas>
<div id="a1" class="t" style="top:545px;font:900 120px/1.1 PL;color:#fff;letter-spacing:-4px">싫다는 말 대신</div>
<div id="a2" class="t" style="top:700px;font:900 150px/1.1 PL;color:#fff;letter-spacing:-4px">다른 길로</div>
<div id="a3" class="t" style="top:870px;font:900 150px/1.1 PL;color:#EFE5FD;letter-spacing:-4px">돌아가요</div>
<div id="a4" class="t" style="top:1090px;font:800 60px/1.3 PR;color:#CFE8E0">부딪히기보다<br>결국 해내는 쪽이에요</div>
<div id="c1" class="t" style="top:470px;font:900 104px/1.15 PL;color:#fff">어디든 뻗어 가는<br><span style="color:#EFE5FD">덩굴 기운</span>이에요</div>
<div id="d1" class="t" style="top:560px;font:900 100px/1.18 PL;color:#fff">맞춰 주다가<br><span style="color:#EFE5FD">내 뜻을 놓칠 때</span>가<br>있어요</div>
<div id="d2" class="t" style="top:1250px;font:800 60px PR;color:#CFE8E0">결국 못 보내고 지워요</div>
<div id="e1" class="t" style="top:520px;font:900 108px/1.18 PL;color:#fff">원하는 것<br><span style="color:#EFE5FD">하나를 먼저</span><br>말해 보세요</div>
<div id="f1" class="t" style="top:521px;font:900 120px/1.18 PL;color:#004D40">내 첫 글자도<br>을일까?</div>
<div id="f2" class="t" style="top:935px;font:800 64px PR;color:#004D40">생일만 넣으면 무료 판정</div>
<div id="f3" class="t" style="top:1142px;left:140px;right:270px;height:150px;border-radius:999px;background:#004D40;color:#EFE5FD;font:900 66px/150px PL">프로필 링크 ↗</div>
</div>
<script src="../../pipeline/motion_fx.js"></script>
<script>
window.FX=['채팅말풍선','속마음쾅','덮개그리기','타자기','원와이프'];
const {cl,mix,ease,eio,sp}=FXK,EM='#004D40',EM2='#00604F',LI='#EFE5FD',W='#FFFFFF',KY='#FEE500',MINT='#CFE8E0';
const $=id=>document.getElementById(id),g=$('cv').getContext('2d'),vis=(id,on)=>$(id).style.display=on?'':'none';
window.SFX=[{t:.3,k:'press'},{t:.8,k:'press'},{t:2.25,k:'swoosh'},{t:2.55,k:'tick'},{t:3.15,k:'tick'},{t:3.75,k:'press'},{t:4.45,k:'tick'},
 {t:6.25,k:'swoosh'},{t:6.8,k:'tick'},{t:7.6,k:'chime'},{t:8.45,k:'swoosh'},{t:9.0,k:'tick'},{t:9.5,k:'tick'},{t:10.25,k:'press'},{t:10.85,k:'swoosh'},
 {t:11.3,k:'tick'},{t:11.85,k:'chime'},{t:13.0,k:'swoosh'},{t:13.6,k:'chime'},{t:14.3,k:'press'}];
// 말풍선 하나(캔버스). 칸 x 80~880 안에서만 그린다. 돌려주는 값 = 높이
function bubH(text,fs=60){return String(text).split('\n').length*Math.round(fs*1.32)+56}
function bub(text,side,y,a,{fs=60,bg,fg='#111'}={}){if(a<=0)return;const lines=String(text).split('\n'),lh=Math.round(fs*1.32);g.save();g.font=`800 ${fs}px PR`;
 const w=Math.min(760,Math.max(...lines.map(l=>g.measureText(l).width))+88),h=bubH(text,fs),x=side=='l'?80:880-w;
 g.translate(side=='l'?x:x+w,y+h);g.scale(a,a);g.translate(side=='l'?0:-w,-h);
 g.fillStyle=bg||(side=='l'?W:KY);g.beginPath();g.roundRect(0,0,w,h,[44,44,side=='l'?44:12,side=='l'?12:44]);g.fill();
 g.fillStyle=fg;g.textBaseline='top';g.textAlign='left';lines.forEach((l,i)=>g.fillText(l,44,28+i*lh));g.restore()}
// 속마음 쾅: 큰 글자가 기울며 떨어져 앉음
function inner(text,y,a,t,t0){if(a<=0)return;const lines=text.split('\n');g.save();g.translate(FXK.cx,y+110);const s=mix(1.7,1,a);g.rotate(mix(-.16,-.05,a));g.scale(s,s);
 if(t-t0<.25){g.translate(Math.sin((t-t0)*70)*8,0)}g.font='900 84px PL';g.textAlign='center';g.textBaseline='middle';g.fillStyle=LI;lines.forEach((l,i)=>g.fillText(l,0,(i-.5*(lines.length-1))*98));g.restore()}
// 보이는 것끼리 쌓아 칸 세로 가운데(FXK.cy)에 앉힘
function stack(t,items,cy=907,gap=48){const vis_=items.map(it=>({...it,a:sp(t-it.t0,15,.62)})).filter(it=>t>=it.t0);
 const hs=vis_.map(it=>it.h*Math.min(1,eio(cl((t-it.t0)/.28))));const H=hs.reduce((s,h)=>s+h,0)+gap*Math.max(0,vis_.length-1);let y=cy-H/2;
 vis_.forEach((it,i)=>{it.draw(y,it.a);y+=hs[i]+gap})}
function pop(id,t0,t,k=15,z=.6){const a=sp(t-t0,k,z);$(id).style.transform=`scale(${a})`;$(id).style.opacity=t>=t0?1:0}
function rise(id,t0,t){const a=sp(t-t0,14,.7);$(id).style.transform=`translateY(${(1-a)*90}px)`;$(id).style.opacity=cl((t-t0)/.12)}
function wipe(t,t0,col,y=907){if(t>=t0&&t<t0+.42){g.fillStyle=col;g.beginPath();g.arc(FXK.cx,y,eio((t-t0)/.42)*1500,0,7);g.fill()}}
// 덩굴: 가운데 바위를 돌아 위로 뻗음(덮개그리기). 잎은 지나간 자리에 톡톡
const VINE=(()=>{const P=[];for(let i=0;i<=60;i++){const u=i/60;const y=mix(1330,840,u);const bend=Math.sin(u*Math.PI)*300;P.push([FXK.cx-300+u*120+bend*(u<.5?1:1)*1.15,y])}return P})();
function vine(t,t0){const p=eio(cl((t-t0)/1.3));
 // 바위
 const r=sp(t-t0+.1,14,.7);g.save();g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.roundRect(FXK.cx-150,1010,230*r,200*r,46);g.fill();g.restore();
 if(p<=0)return;const n=Math.max(2,Math.floor(p*VINE.length));g.save();g.lineCap='round';g.lineJoin='round';g.strokeStyle='#7FD6A8';g.lineWidth=22;g.beginPath();
 for(let i=0;i<n;i++){const q=VINE[i];i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1])}g.stroke();
 for(let i=6;i<n;i+=7){const q=VINE[i],s=sp(t-t0-(i/60)*1.3-.05,15,.55),d=(i/7)%2?1:-1;if(s<=0)continue;g.save();g.translate(q[0],q[1]);g.rotate(d*.7);g.scale(s,s);
  g.fillStyle=(i/7)%2?'#3FD483':LI;g.beginPath();g.ellipse(d*38,0,40,22,0,0,7);g.fill();g.restore()}
 const e=VINE[n-1];g.fillStyle=LI;g.beginPath();g.arc(e[0],e[1],18,0,7);g.fill();g.restore()}
// 입력창: 치다가 지움(타자기)
const TYPED='나 사실 매운 거 별로…';
function input(t){const y=1040,h=160,x0=80,x1=880;g.save();g.fillStyle='rgba(255,255,255,.12)';g.beginPath();g.roundRect(x0,y,x1-x0,h,40);g.fill();
 let k=0;if(t<9.0)k=0;else if(t<10.0)k=Math.floor((t-9.0)/1.0*TYPED.length);else if(t<10.3)k=TYPED.length;else k=Math.max(0,TYPED.length-Math.floor((t-10.3)/.45*TYPED.length));
 const s=TYPED.slice(0,k);g.font='800 60px PR';g.textBaseline='middle';g.textAlign='left';g.fillStyle=W;g.fillText(s,x0+44,y+h/2+2);
 if(Math.floor(t*3)%2==0){const cw=g.measureText(s).width;g.fillStyle=LI;g.fillRect(x0+48+cw,y+h/2-36,6,72)}
 // 보내기 단추(눌리지 않음)
 g.fillStyle=k>0?KY:'rgba(255,255,255,.25)';g.beginPath();g.arc(x1-80,y+h/2,46,0,7);g.fill();g.strokeStyle=EM;g.lineWidth=10;g.lineCap='round';g.beginPath();g.moveTo(x1-80,y+h/2+20);g.lineTo(x1-80,y+h/2-18);g.moveTo(x1-98,y+h/2-2);g.lineTo(x1-80,y+h/2-20);g.lineTo(x1-62,y+h/2-2);g.stroke();g.restore()}
function draw0(t){
 let bg=EM; if(t>=13.2)bg=LI; g.fillStyle=bg;g.fillRect(0,0,1080,1920);
 // 1 훅(0초부터 글자 다 보임, K-139)
 const s1=t<2.4;['a1','a2','a3','a4'].forEach(i=>vis(i,s1));
 if(s1){const a=sp(t+.25,16,.55),b=sp(t+.1,16,.55);$('a1').style.transform=`scale(${mix(.86,1,a)})`;$('a2').style.transform=`translateX(${mix(-40,0,b)}px)`;
  const c=sp(t+.05,14,.6);$('a3').style.transform=`translateX(${mix(60,0,c)}px) rotate(${mix(4,0,c)}deg)`;
  $('a4').style.opacity=cl((t-.4)/.2);$('a4').style.transform=`translateY(${(1-sp(t-.4,14,.7))*60}px)`}
 // 2 카톡: 마라탕 → 좋아 → (속마음 쾅) → 옆집 파스타
 wipe(t,2.2,EM2);const s2=t>=2.4&&t<6.4;
 if(s2){g.fillStyle=EM2;g.fillRect(0,0,1080,1920);
  stack(t,[{t0:2.55,h:bubH('주말에 마라탕 ㄱㄱ?'),draw:(y,a)=>bub('주말에 마라탕 ㄱㄱ?','l',y,a)},
   {t0:3.15,h:bubH('좋아ㅎㅎ'),draw:(y,a)=>bub('좋아ㅎㅎ','r',y,a)},
   {t0:3.75,h:220,draw:(y,a)=>inner('(사실 매운 거\n못 먹음)',y,a,t,3.75)},
   {t0:4.45,h:bubH('근데 옆집 파스타도\n맛있대!'),draw:(y,a)=>bub('근데 옆집 파스타도\n맛있대!','r',y,a)}])}
 // 3 덩굴 기운: 바위를 돌아 뻗는 덩굴
 wipe(t,6.2,EM);const s3=t>=6.4&&t<8.6;vis('c1',s3);
 if(s3){rise('c1',6.45,t);vine(t,6.8)}
 // 4 까닭: 쳤다가 지움
 wipe(t,8.4,EM2);const s4=t>=8.6&&t<11.0;['d1','d2'].forEach(i=>vis(i,s4));
 if(s4){g.fillStyle=EM2;g.fillRect(0,0,1080,1920);rise('d1',8.65,t);input(t);$('d2').style.opacity=cl((t-10.4)/.2)}
 // 5 해 볼 것: 이번엔 먼저 보냄 → 답이 옴
 wipe(t,10.8,EM);const s5=t>=11.0&&t<13.2;vis('e1',s5);
 if(s5){rise('e1',11.05,t);bub('나 이번엔 파스타!','r',990,sp(t-11.3,15,.6));bub('좋아, 거기로 가자!','l',1173,sp(t-11.85,15,.6))}
 // 6 끝
 wipe(t,13.0,LI);const s6=t>=13.2;['f1','f2','f3'].forEach(i=>vis(i,s6));
 if(s6){const a=sp(t-13.2,15,.62);$('f1').style.transform=`scale(${mix(1.3,1,a)})`;$('f2').style.opacity=cl((t-13.6)/.2);pop('f3',13.9,t);
  if(t>=14.3&&t<14.45)$('f3').style.transform='scale(.94)'}
}
(async()=>{await document.fonts.load('900 100px PL');await document.fonts.load('800 40px PR');window.seek=t=>{draw0(t);const p=g.getImageData(4,4,1,1).data;document.body.style.background=`rgb(${p[0]},${p[1]},${p[2]})`;const fr=document.getElementById('zsfr').getContext('2d');fr.clearRect(0,0,1080,1920);FXK.frame(fr,{ai:'AI가 계산·작성한 콘텐츠예요'})};seek(0)})();
</script><canvas id="zsfr" width="1080" height="1920" style="position:absolute;left:0;top:0;z-index:99;pointer-events:none"></canvas></body></html>
