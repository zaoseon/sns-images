<!doctype html><html><head><meta charset="utf-8">
<!-- 11/23(월) 17:00 인스타 릴스 실험 칸 · 형식 C(그림 — 코드로 그린 평면 일러스트, 카메라 이동·시차) · 일간 정
     글: 3회차 정 문장 그대로(훅·둘째 줄·기운·까닭·해 볼 것, reel_swaps ilgan3-1118-1127 의 11-23 칸). 새 문장은 메모 세 장의 예시 낱말과 끝 장면뿐.
     메모 낱말은 '남이 흘린 말'을 보여 주는 예시 장면 — 숫자·통계 없음. 정월 없음(K-197). 화면에 한자 없음.
     판 v_violet(#311B92 + 탠저린 크림 #FFE0B2), 촛불 주황 #FFB547 하나만 더함(색 3개). 글 칸 x 50~900(가운데 FXK.cx). -->
<style>html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#311B92}canvas{position:absolute;inset:0}</style></head>
<body><canvas id="cv" width="1080" height="1920"></canvas>
<script src="../../pipeline/motion_fx.js"></script><script>
window.FX=['카메라팬','시차벽','메모붙이기','성냥불켜기','빛번짐','선물오가기','손글씨줄긋기'];
const F=FXK,{cl,mix,ease,eio,sp}=F,BG='#311B92',B2='#45299F',B3='#5A3DB0',CR='#FFE0B2',FL='#FFB547',IV='#FFF6EA',g=document.getElementById('cv').getContext('2d');
window.SFX=[{t:.1,k:'whoosh'},{t:.05,k:'pop'},{t:.4,k:'thud'},{t:2.9,k:'swoosh'},{t:3.2,k:'chime'},
 {t:5.7,k:'whoosh'},{t:6.1,k:'tick'},{t:6.4,k:'ding'},{t:8.6,k:'swoosh'},{t:9.1,k:'pop'},{t:9.6,k:'pop'},{t:10.2,k:'boing'},
 {t:11.1,k:'whoosh'},{t:11.6,k:'tick'},{t:12.6,k:'ding'},{t:13.2,k:'swoosh'},{t:13.6,k:'pop'},{t:14.3,k:'ding'}];
function T(txt,x,y,font,color,align='center'){g.font=font;g.fillStyle=color;g.textAlign=align;g.textBaseline='middle';g.fillText(txt,x,y)}
function fade(t,a,b){return cl((t-a)/.25)*cl((b-t)/.25)}
// 촛불: 몸통 + 심지 + 흔들리는 불꽃(사인 두 개 겹침, seek 시각으로만 움직임)
function candle(x,y,s,lit,t,gr=260){g.save();g.translate(x,y);g.scale(s,s);
 if(lit>0){const r=mix(0,gr,ease(lit));g.fillStyle='rgba(255,181,71,.13)';g.beginPath();g.arc(0,-150,r,0,7);g.fill();g.fillStyle='rgba(255,181,71,.12)';g.beginPath();g.arc(0,-150,r*.62,0,7);g.fill()}
 g.fillStyle=CR;g.beginPath();g.roundRect(-58,-60,116,230,18);g.fill();g.fillStyle=B3;g.fillRect(-58,120,116,14);
 g.fillStyle=BG;g.fillRect(-4,-92,8,34);
 if(lit>0){const w=Math.sin(t*9)*6+Math.sin(t*23)*3,h=mix(10,96,ease(lit));g.fillStyle=FL;g.beginPath();g.moveTo(-26,-96);g.quadraticCurveTo(-30,-96-h*.55,w,-96-h);g.quadraticCurveTo(30,-96-h*.55,26,-96);g.quadraticCurveTo(0,-74,-26,-96);g.fill();
  g.fillStyle=IV;g.beginPath();g.ellipse(w*.4,-110,9,h*.18,0,0,7);g.fill()}
 g.restore()}
// 방 벽(시차): 창문은 느리게, 선반은 빠르게 지나간다. cam = 카메라가 오른쪽으로 간 거리
function room(cam){window.__zsLoose=1;g.fillStyle=B3;for(let i=-1;i<6;i++){const x=((i*300-cam)%1800+1800)%1800-400;g.fillRect(x,1272,220,16)}window.__zsLoose=0}   // 탁자 줄이 지나가며 카메라가 옆으로 흐르는 느낌(시차)
function memo(x,y,rot,txt,s){window.__zsLoose=1;g.save();g.translate(x,y);g.rotate(rot);g.scale(s,s);g.fillStyle=CR;g.beginPath();g.roundRect(-230,-54,460,108,14);g.fill();
 g.fillStyle=FL;g.fillRect(-36,-66,72,22);T(txt,0,4,'900 64px PL',BG);g.restore();window.__zsLoose=0}
function draw(t){const X=F.cx,cam=t*180;g.fillStyle=BG;g.fillRect(0,0,1080,1920);
 for(let i=0;i<30;i++){g.fillStyle='rgba(255,224,178,.18)';g.beginPath();g.arc(F.H(i)*1080,F.H(i+5)*300+60,2+F.H(i+9)*3,0,7);g.fill()}
 // 1 훅 — 메모가 한 장씩 붙고 큰 글자가 쾅
 if(t<2.9){const a=cl((2.9-t)/.25);g.save();g.globalAlpha=a;
  const M=[['커피는 연하게',-.07,-.3],['목요일 면접',.05,-.12],['고양이 이름 보리',-.03,.05]];
  M.forEach(([s,r,t0],i)=>{const b=sp(t-t0,15,.55);if(b>0)memo(X,912+i*184,r,s,b)});
  const s1=sp(t+.25,14,.6);g.save();g.translate(X,540);g.scale(s1,s1);T('남이 흘린 말을',0,0,'900 100px PL',IV);g.restore();
  {const b=sp(t+.2,16,.5);g.save();g.translate(X,690);g.scale(b,b);T('다 기억해 둬요',0,0,'900 116px PL',FL);g.restore()}
  g.restore()}
 // 2 방을 지나가는 카메라 + 한 줄
 if(t>=2.8&&t<5.8){const a=fade(t,2.8,5.8);g.save();g.globalAlpha=a;room(cam);
  T('작은 걸 챙기는 데',X,600,'900 96px PL',IV);
  if(t>3.2){const b=sp(t-3.2,14,.6);g.save();g.translate(X,864);g.scale(b,b);T('진심이에요',0,0,'900 120px PL',FL);g.restore()}
  candle(X,1060,.9,0,t);   // 11/15 K-213: 탁자 줄(y1272)과 48px 이상
  g.restore()}
 // 3 성냥이 그어지고 촛불이 켜짐 — 빛이 번짐
 if(t>=5.7&&t<8.7){const a=fade(t,5.7,8.7);g.save();g.globalAlpha=a;
  const lit=cl((t-6.1)/.7);candle(X,1170,.95,lit,t,140);   // 11/15 대표 '촛불이랑 밤을 밝히는 촛불 기운 붙어있음'(K-213)
  if(t<6.3){const p=ease(cl((t-5.8)/.45));g.save();g.translate(mix(X+330,X+40,p),mix(1200,1045,p));g.rotate(-.6);g.fillStyle=CR;g.fillRect(-6,0,12,120);g.fillStyle=FL;g.beginPath();g.arc(0,0,14,0,7);g.fill();g.restore()}
  T('태어난 날 첫 글자가',X,565,'900 76px PL',CR);
  const b=sp(t-6.0,14,.6);g.save();g.translate(X,700);g.scale(b,b);T('정인 사람',0,0,'900 120px PL',IV);g.restore();
  if(t>6.6){const c=sp(t-6.6,14,.6);g.save();g.translate(X,850);g.scale(c,c);T('밤을 밝히는 촛불 기운',0,0,'900 80px PL',FL);g.restore()}
  g.restore()}
 // 4 선물이 오가고, 돌아오는 게 없으면 불이 작아짐
 if(t>=8.6&&t<11.2){const a=fade(t,8.6,11.2);g.save();g.globalAlpha=a;
  const shrink=1-.55*ease(cl((t-10.1)/.6));candle(X,1118,.8,shrink,t);
  for(let i=0;i<2;i++){const t0=8.9+i*.5,p=ease(cl((t-t0)/.6));if(p<=0)continue;const tx=X+(i?300:-300);window.__zsLoose=1;g.save();g.translate(mix(X,tx,p),mix(1080,1180,p));g.scale(.8,.8);
   g.fillStyle=CR;g.beginPath();g.roundRect(-46,-40,92,80,10);g.fill();g.fillStyle=FL;g.fillRect(-8,-40,16,80);g.fillRect(-46,-8,92,16);g.restore();window.__zsLoose=0}
  T('챙긴 만큼',X,597,'900 100px PL',IV);
  if(t>9.6){const b=sp(t-9.6,14,.6);g.save();g.translate(X,737);g.scale(b,b);T('안 돌아오면',0,0,'900 100px PL',IV);g.restore()}
  if(t>10.2){const c=sp(t-10.2,15,.55);g.save();g.translate(X,877);g.scale(c,c);T('서운해지기도 해요',0,0,'900 92px PL',FL);g.restore()}
  g.restore()}
 // 5 해 볼 것 — 노트에 한 줄 긋기
 if(t>=11.1&&t<13.3){const a=fade(t,11.1,13.3);g.save();g.globalAlpha=a;
  T('오늘 해 볼 것',X,560,'900 80px PL',CR);
  const n=sp(t-11.3,13,.65);g.save();g.translate(X,900);g.scale(n,n);g.fillStyle=IV;g.beginPath();g.roundRect(-400,-210,800,420,28);g.fill();
  g.fillStyle=B3;for(let i=0;i<3;i++)g.fillRect(-340,-90+i*110,680,6);
  const s='오늘 나를 챙긴 일 하나',k=Math.floor(cl((t-11.6)/1)*s.length);T(s.slice(0,k),-340,-130,'900 62px PL',BG,'left');
  if(t>12.6){const p=ease(cl((t-12.6)/.4));g.fillStyle=FL;g.fillRect(-340,-40,680*p,14)}
  g.restore();
  if(t>11.4){const b=sp(t-11.4,14,.6);g.save();g.translate(X,1240);g.scale(b,b);T('적어 보세요',0,0,'900 96px PL',FL);g.restore()}
  g.restore()}
 // 6 끝 — 질문 + 무료 판정
 if(t>=13.3){const a=cl((t-13.3)/.25);g.save();g.globalAlpha=a;candle(X,1225,.6,1,t,110);
  const s=sp(t-13.4,14,.6);g.save();g.translate(X,560);g.scale(s,s);T('내 첫 글자도',0,0,'900 116px PL',IV);T('정일까?',0,150,'900 116px PL',FL);g.restore();
  const b=sp(t-14.1,14,.6);g.save();g.translate(X,930);g.scale(b,b);g.fillStyle=CR;g.beginPath();g.roundRect(-405,-70,810,140,70);g.fill();T('생일만 넣으면 무료 판정 →',0,-2,'900 60px PL',BG);g.restore();
  g.restore()}
 F.frame(g,{ai:'AI가 계산·작성한 콘텐츠예요'});
}
(async()=>{await window.__zsFonts;for(const f of ['900 100px PL','800 40px PR'])await document.fonts.load(f);window.coverT=1;
window.seek=draw;draw(0)})();
</script></body></html>
