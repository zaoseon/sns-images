<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:PL;src:url(../../pipeline/fonts/Paperlogy-9Black.ttf)}
@font-face{font-family:PR;src:url(../../pipeline/fonts/PRETENDARD-EXTRABOLD.OTF)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#3B82F6}
#s{position:absolute;inset:0;overflow:hidden}canvas{position:absolute;inset:0}
.t{position:absolute;left:0;right:0;text-align:center;white-space:nowrap}
.b{position:absolute;max-width:700px;padding:30px 40px;border-radius:44px;font:800 54px/1.35 PR;box-sizing:border-box;transform-origin:var(--o)}
.l{left:90px;background:#fff;color:#111;border-bottom-left-radius:12px;--o:0% 100%}
.r{right:90px;background:#FFD93D;color:#111;border-bottom-right-radius:12px;--o:100% 100%}
#who{position:absolute;left:90px;top:440px;font:800 38px PR;color:#DCE8FF}
#dots{position:absolute;left:90px;top:520px;width:170px;height:96px;border-radius:44px;background:#fff}
#brand{position:absolute;top:300px;left:90px;font:900 44px PL;color:#FFD93D}#ai{position:absolute;bottom:300px;left:0;right:0;text-align:center;font:800 32px PR;color:#DCE8FF}
.card{position:absolute;top:900px;width:400px;height:400px;border-radius:48px;font:900 70px/1.2 PL;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#111}
.card b{font:900 150px PL;line-height:1}
</style></head><body><div id="s"><canvas id="cv" width="1080" height="1920"></canvas>
<div id="who">친구</div><div id="dots"></div>
<div id="m1" class="b l" style="top:520px">미안ㅠㅠ 오늘 못 갈 것 같아</div>
<div id="m2" class="b r" style="top:720px">헐 진짜?? 아쉽다ㅠ<br>괜찮아 다음에 보자!!</div>
<div id="in" class="t" style="top:1130px;font:900 220px PL;color:#FFD93D;letter-spacing:-8px">앗싸</div>
<div id="in0" class="t" style="top:1070px;font:800 46px PR;color:#fff">(속마음)</div>
<div id="q1" class="t" style="top:600px;font:900 110px PL;color:#fff;letter-spacing:-4px;line-height:1.15">이거 나만<br>그래?</div>
<div id="h1" class="t" style="top:560px;font:800 54px PR;color:#111">사주에 이게 있으면 그래요</div>
<div id="h2" class="t" style="top:640px;font:900 200px PL;color:#111;letter-spacing:-6px">화개살</div>
<div id="h3" class="t" style="top:1380px;font:800 52px/1.5 PR;color:#111">꽃 덮개 아래에서<br><b style="font:900 60px PL">혼자 있을 때 충전</b>되는 기운</div>
<div id="k1" class="t" style="top:640px;font:900 96px/1.2 PL;color:#fff">사람이 싫은 게<br>아니라</div>
<div id="k2" class="t" style="top:900px;font:900 96px/1.2 PL;color:#FFD93D">충전 방식이<br>다를 뿐</div>
<div id="c0" class="t" style="top:640px;font:900 84px PL;color:#fff">취소됐을 때 내 마음은?</div>
<div id="c1" class="card" style="left:90px;background:#FFD93D"><b>1</b>홀가분</div>
<div id="c2" class="card" style="right:90px;background:#fff"><b>2</b>서운함</div>
<div id="c3" class="t" style="top:1380px;font:800 54px PR;color:#fff">댓글에 <b style="color:#FFD93D">번호만</b> 남겨 줘</div>
<div id="e1" class="t" style="top:680px;font:900 92px/1.25 PL;color:#111">내 사주에도<br>화개살 있을까?</div>
<div id="e2" class="t" style="top:1000px;font:800 56px PR;color:#111">생년월일만 넣으면 1초</div>
<div id="e3" class="t" style="top:1120px;left:190px;right:190px;height:140px;border-radius:999px;background:#111;color:#FFD93D;font:900 60px/140px PL">프로필 링크 ↗</div>
<div id="brand">자오선</div><div id="ai">AI가 계산·작성한 콘텐츠예요</div></div>
<script src="../../pipeline/motion_fx.js"></script>
<script>
window.FX=['채팅말풍선','속마음쾅','덮개그리기','고르기카드'];
const {cl,mix,ease,eio,sp}=FXK,BL='#3B82F6',Y='#FFD93D',W='#F8FAFC';
const $=id=>document.getElementById(id),g=$('cv').getContext('2d'),vis=(id,on)=>$(id).style.display=on?'':'none';
window.SFX=[{t:.35,k:'tick'},{t:.55,k:'tick'},{t:.75,k:'tick'},{t:1,k:'press'},{t:2,k:'press'},{t:3,k:'chime'},{t:4,k:'swoosh'},{t:5,k:'swoosh'},{t:5.4,k:'chime'},
 {t:7,k:'swoosh'},{t:7.5,k:'press'},{t:8,k:'press'},{t:9,k:'swoosh'},{t:9.5,k:'press'},{t:9.75,k:'press'},{t:10.5,k:'tick'},{t:11,k:'tick'},{t:12,k:'swoosh'},{t:13,k:'chime'},{t:14,k:'press'}];
function pop(id,t0,t){const a=sp(t-t0,15,.6);$(id).style.transform=`scale(${a})`;$(id).style.opacity=t>=t0?1:0}
function seek(t){
 let bg=t<4.8?BL:t<7?Y:t<9?BL:t<12?BL:Y; if(t>=3&&t<3.5)bg=t<3.25?Y:BL;
 g.fillStyle=bg;g.fillRect(0,0,1080,1920);
 // 1 대화
 const s1=t<4; vis('who',s1);vis('dots',t>=.25&&t<1);vis('m1',t>=1&&s1);vis('m2',t>=2&&s1);
 if(t>=.25&&t<1){const d=$('dots');d.innerHTML='';const c=document.createElement('canvas');} 
 if(t>=.25&&t<1){for(let i=0;i<3;i++){const y=568-Math.max(0,Math.sin((t*8-i*.9)))*10;g.fillStyle='#9AA7BF';g.beginPath();g.arc(135+i*40,y,11,0,7);g.fill()}}
 if(t>=1&&s1)pop('m1',1,t); if(t>=2&&s1)pop('m2',2,t);
 if(s1&&t>=3.4){const k=ease((t-3.4)/.5);$('m1').style.opacity=1-k;$('m2').style.opacity=1-k}
 vis('in0',t>=3&&t<4.1);vis('in',t>=3&&t<4.1);
 if(t>=3&&t<4.1){const a=sp(t-3,18,.5);$('in').style.transform=`scale(${mix(2.2,1,a)}) rotate(${mix(-12,-4,a)}deg)`;
  g.save();g.translate(540,1250);g.fillStyle='rgba(255,217,61,.22)';for(let i=0;i<14;i++){g.rotate(6.283/14);const L=mix(0,700,ease((t-3)/.4));g.fillRect(-10,-L,20,L*.55)}g.restore()}
 vis('q1',t>=4&&t<5);if(t>=4&&t<5){const a=sp(t-4,16,.6);$('q1').style.transform=`translateY(${(1-a)*120}px)`;$('q1').style.opacity=cl((t-4)/.1)}
 // 2 화개살: 꽃 덮개를 그린다
 const s2=t>=5&&t<7.05;['h1','h2','h3'].forEach(i=>vis(i,s2));
 if(t>=4.8&&t<5.2){g.fillStyle=Y;g.beginPath();g.arc(540,1920,eio((t-4.8)/.4)*2300,0,7);g.fill()}
 if(s2){$('h1').style.opacity=cl((t-5.1)/.2);const a=sp(t-5.4,16,.6);$('h2').style.transform=`scale(${mix(1.5,1,a)})`;$('h2').style.opacity=t>=5.4?1:0;
  const p=eio((t-5.8)/.8),cx=540,cy=1180;g.strokeStyle='#111';g.lineWidth=12;g.lineCap='round';
  g.beginPath();g.arc(cx,cy,230,Math.PI,Math.PI+Math.PI*p);g.stroke();
  for(let i=0;i<7;i++){const q=sp(t-6.2-i*.06,14,.6);const ang=Math.PI+Math.PI*(i+.5)/7;g.fillStyle=i%2?'#fff':BL;g.beginPath();g.arc(cx+Math.cos(ang)*230,cy+Math.sin(ang)*230,28*q,0,7);g.fill()}
  const q=sp(t-6.4,14,.6);if(q>0){g.fillStyle='#111';g.fillRect(cx-6,cy-230*q+230,12,0);g.beginPath();g.moveTo(cx,cy);g.lineTo(cx,cy+170*q);g.stroke();
   g.beginPath();g.arc(cx,cy+110,44*q,0,7);g.fill();g.fillStyle=BL;g.beginPath();g.arc(cx,cy+110,18*q,0,7);g.fill()}
  $('h3').style.opacity=cl((t-6.3)/.2)}
 // 3 큰 글자 두 줄
 if(t>=6.85&&t<7.15){g.fillStyle=BL;g.fillRect(0,0,1080,eio((t-6.85)/.3)*1920)}
 vis('k1',t>=7&&t<9);vis('k2',t>=7.5&&t<9);
 if(t>=7&&t<9){pop('k1',7.5-.5,t);pop('k2',8,t);$('k1').style.transform=`translateY(${(1-sp(t-7,14,.7))*80}px)`;
  for(let i=0;i<9;i++){const x=120+i*105,h=mix(0,60+((i*37)%5)*40,sp(t-8-i*.03,12,.6));g.fillStyle='rgba(255,255,255,.25)';g.fillRect(x,1450-h,52,h)}
  g.fillStyle='#fff';g.font='800 40px PR';g.textAlign='center';if(t>8.3)g.fillText('나만의 충전 막대',540,1520)}
 // 4 고르기
 const s4=t>=9&&t<12;['c0','c1','c2','c3'].forEach(i=>vis(i,s4));
 if(s4){$('c0').style.opacity=cl((t-9)/.15);pop('c1',9.5,t);pop('c2',9.75,t);
  const k=Math.floor((t-10.4)/.5);if(t>=10.4){$('c1').style.transform=`scale(${k%2?1:1.08})`;$('c2').style.transform=`scale(${k%2?1.08:1})`}
  $('c3').style.opacity=cl((t-10.4)/.2)}
 // 5 끝
 const s5=t>=12;['e1','e2','e3'].forEach(i=>vis(i,s5));
 if(t>=11.8&&t<12.2){g.fillStyle=Y;g.beginPath();g.arc(540,1060,eio((t-11.8)/.4)*1400,0,7);g.fill()}
 if(s5){const a=sp(t-12,15,.62);$('e1').style.transform=`scale(${mix(1.4,1,a)})`;$('e2').style.opacity=cl((t-12.6)/.2);pop('e3',13,t);
  if(t>=14&&t<14.15)$('e3').style.transform='scale(.94)';
  FXK.trail(g,t,13.2,1.5,u=>{const a=-Math.PI/2+u*6.6;return[540+Math.cos(a)*420,1190+Math.sin(a)*92]},{color:'#111',loop:true,r:12})}
 const dark=(bg==BL);$('brand').style.color=dark?Y:'#111';$('ai').style.color=dark?'#DCE8FF':'#5a5a5a';
}
(async()=>{await document.fonts.load('900 100px PL');await document.fonts.load('800 40px PR');window.seek=seek;seek(0)})();
</script></body></html>
