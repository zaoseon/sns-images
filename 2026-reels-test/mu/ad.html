<div id="e1" class="t" style="top:440px;font:900 108px/1.48 PL;color:#fff">힘든 것 하나를<br><span style="color:#E1F5FE">말로 꺼내</span><br>보세요</div>

<div id="f3" class="t" style="top:1142px;left:140px;right:270px;height:150px;border-radius:999px;background:#3E2723;color:#E1F5FE;font:900 66px/150px PL">프로필 링크 ↗</div>

<script src="../../pipeline/motion_fx.js"></script>
<script>
window.FX=['글자스태거','노드불켜기','덮개그리기','픽셀블록','채팅말풍선','원와이프'];
const {cl,mix,ease,eio,sp}=FXK,BR='#3E2723',BR2='#4E342E',LI='#E1F5FE',W='#FFFFFF',SAND='#D7CCC8';
const $=id=>document.getElementById(id),g=$('cv').getContext('2d'),vis=(id,on)=>$(id).style.display=on?'':'none';
window.SFX=[{t:.25,k:'press'},{t:.8,k:'press'},{t:2.25,k:'swoosh'},{t:2.6,k:'tick'},{t:3.0,k:'tick'},{t:4.3,k:'chime'},{t:4.7,k:'press'},
 {t:6.25,k:'swoosh'},{t:6.6,k:'tick'},{t:7.7,k:'thud'},{t:8.45,k:'swoosh'},{t:8.75,k:'thud'},{t:9.05,k:'thud'},{t:9.35,k:'thud'},
 {t:10.85,k:'swoosh'},{t:11.35,k:'pop'},{t:11.95,k:'chime'},{t:13.0,k:'swoosh'},{t:13.6,k:'chime'},{t:14.3,k:'press'}];
function bubH(text,fs=60){return String(text).split('\n').length*Math.round(fs*1.32)+56}
function bub(text,side,y,a,{fs=60,bg,fg='#111'}={}){if(a<=0)return;const lines=String(text).split('\n'),lh=Math.round(fs*1.32);g.save();g.font=`800 ${fs}px PR`;
 const w=Math.min(760,Math.max(...lines.map(l=>g.measureText(l).width))+88),h=bubH(text,fs),x=side=='l'?80:880-w;
 g.translate(side=='l'?x:x+w,y+h);g.scale(a,a);g.translate(side=='l'?0:-w,-h);
 g.fillStyle=bg||(side=='l'?W:LI);g.beginPath();g.roundRect(0,0,w,h,[44,44,side=='l'?44:12,side=='l'?12:44]);g.fill();
 g.fillStyle=fg;g.textBaseline='top';g.textAlign='left';lines.forEach((l,i)=>g.fillText(l,44,28+i*lh));g.restore()}
function rise(id,t0,t){const a=sp(t-t0,14,.7);$(id).style.transform=`translateY(${(1-a)*90}px)`;$(id).style.opacity=cl((t-t0)/.12)}
function pop(id,t0,t,k=15,z=.6){const a=sp(t-t0,k,z);$(id).style.transform=`scale(${a})`;$(id).style.opacity=t>=t0?1:0}
function wipe(t,t0,col,y=907){if(t>=t0&&t<t0+.42){g.fillStyle=col;g.beginPath();g.arc(FXK.cx,y,eio((t-t0)/.42)*1500,0,7);g.fill()}}
// 60일 점 격자(10칸 x 6줄): 차례로 켜지고, 무(다섯째 칸)만 한 줄로 밝아짐
const GX=76,GY=76,GR=22,GT=640;
function grid(t,t0){const x0=FXK.cx-GX*4.5;
 const on=t>=t0+1.8,q=sp(t-t0-1.8,14,.6);
 if(on){g.save();g.strokeStyle=LI;g.lineWidth=8;const cx=x0+4*GX;g.beginPath();g.roundRect(cx-GR-14,GT-GR-14,2*GR+28,5*GY+2*GR+28,40);g.globalAlpha=cl(q);g.stroke();g.restore()}
 for(let i=0;i<60;i++){const c=i%10,r=Math.floor(i/10),a=sp(t-t0-i*.008,16,.6);if(a<=0)continue;const mu=c==4;
  g.fillStyle=mu&&on?LI:'rgba(255,255,255,.55)';const rr=GR*a*(mu&&on?mix(1,1.15,cl(q)):1);g.beginPath();g.arc(x0+c*GX,GT+r*GY,rr,0,7);g.fill()}}
// 산: 선으로 그린 뒤 채움, 꼭대기 눈
function mountain(t,t0){const p=eio(cl((t-t0)/.9)),cx=FXK.cx,top=900,base=1340,hw=380;if(p<=0)return;
 const P=[[cx-hw,base],[cx-120,1050],[cx,top],[cx+150,1090],[cx+hw,base]];
 const L=[];for(let i=0;i<P.length-1;i++){const a=P[i],b=P[i+1];L.push(Math.hypot(b[0]-a[0],b[1]-a[1]))}const T=L.reduce((s,v)=>s+v,0);
 const f=cl((t-t0-.9)/.3);if(f>0){g.save();g.globalAlpha=f;g.fillStyle=BR2;g.beginPath();P.forEach((q,i)=>i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1]));g.closePath();g.fill();
  g.fillStyle=LI;g.beginPath();g.moveTo(cx-60,top+60*1.7);g.lineTo(cx,top);g.lineTo(cx+65,top+65*1.27);g.lineTo(cx+20,top+80);g.lineTo(cx-20,top+95);g.closePath();g.fill();g.restore()}
 g.save();g.strokeStyle=SAND;g.lineWidth=12;g.lineJoin='round';g.lineCap='round';g.beginPath();let d=p*T;g.moveTo(P[0][0],P[0][1]);
 for(let i=0;i<L.length;i++){const a=P[i],b=P[i+1];if(d>=L[i]){g.lineTo(b[0],b[1]);d-=L[i]}else{const u=d/L[i];g.lineTo(mix(a[0],b[0],u),mix(a[1],b[1],u));break}}g.stroke();
 g.lineWidth=12;g.beginPath();g.moveTo(cx-hw-20,base);g.lineTo(cx+hw+20,base);g.globalAlpha=cl((t-t0)/.3);g.stroke();g.restore()}
// 짐 상자가 하나씩 떨어져 쌓임(픽셀블록)
function boxes(t){const base=1330,bw=[440,380,320],bh=64,gap=48;
 g.save();g.fillStyle=SAND;g.fillRect(FXK.cx-260,base,520,12);
 bw.forEach((w,i)=>{const t0=8.75+i*.3;if(t<t0-.3)return;const y1=base-(i+1)*(bh+gap),u=cl((t-t0+.3)/.3);const y=mix(y1-420,y1,u*u);
  const sq=t>=t0?1-.18*Math.exp(-(t-t0)*14)*Math.sin((t-t0)*30):1;
  g.save();g.translate(FXK.cx,y+bh);g.scale(1/sq,sq);g.fillStyle=i%2?LI:'rgba(255,255,255,.55)';g.beginPath();g.roundRect(-w/2,-bh,w,bh,14);g.fill();g.restore()});g.restore()}
function draw0(t){
 let bg=BR; if(t>=13.2)bg=LI; g.fillStyle=bg;g.fillRect(0,0,1080,1920);
 // 1 훅(0초부터 글자 다 보임, K-139): '흔들릴 때' 글자가 한 자씩 흔들리고, 아래 두 줄은 그대로
 const s1=t<2.4;['a1','a2','a3','a4'].forEach(i=>vis(i,s1));
 if(s1){[...$('a1').querySelectorAll('span')].forEach((s,i)=>{const k=Math.exp(-Math.max(0,t-1.6)*3);s.style.transform=`rotate(${Math.sin(t*14+i*1.3)*7*k}deg) translateY(${Math.sin(t*11+i)*8*k}px)`});
  const b=sp(t+.1,16,.55);$('a2').style.transform=`scale(${mix(.9,1,b)})`;const c=sp(t+.05,14,.6);$('a3').style.transform=`scale(${mix(.9,1,c)})`;
  $('a4').style.opacity=cl((t-.4)/.2);$('a4').style.transform=`translateY(${(1-sp(t-.4,14,.7))*60}px)`}
 // 2 60일 격자 → 무 한 줄
 wipe(t,2.2,BR2);const s2=t>=2.4&&t<6.4;['b1','b2','b3'].forEach(i=>vis(i,s2));
 if(s2){g.fillStyle=BR2;g.fillRect(0,0,1080,1920);rise('b1',2.45,t);grid(t,2.45);
  rise('b2',2.6,t);rise('b3',2.75,t);$('b2k').textContent=t>=4.25?'6일':'?일';if(t>=4.25){const a=sp(t-4.25,15,.5);$('b2k').style.transform=`scale(${mix(1.6,1,a)})`}}
 // 3 산 기운: 선으로 산을 그림
 wipe(t,6.2,BR);const s3=t>=6.4&&t<8.6;vis('c1',s3);
 if(s3){rise('c1',6.45,t);mountain(t,6.6)}
 // 4 까닭: 짐 상자가 쌓여도 티를 안 냄
 wipe(t,8.4,BR2);const s4=t>=8.6&&t<11.0;['d1','d2'].forEach(i=>vis(i,s4));
 if(s4){g.fillStyle=BR2;g.fillRect(0,0,1080,1920);rise('d1',8.65,t);rise('d2',8.8,t);boxes(t)}
 // 5 해 볼 것: 먼저 꺼낸 한마디 → 답
 wipe(t,10.8,BR);const s5=t>=11.0&&t<13.2;vis('e1',s5);
 if(s5){rise('e1',11.05,t);bub('나 요즘 좀 힘들어','r',990,sp(t-11.35,15,.6));bub('말해 줘서 고마워','l',1173,sp(t-11.95,15,.6))}
 // 6 끝
 wipe(t,13.0,LI);const s6=t>=13.2;['f1','f2','f3'].forEach(i=>vis(i,s6));
 if(s6){const a=sp(t-13.2,15,.62);$('f1').style.transform=`scale(${mix(1.3,1,a)})`;$('f2').style.opacity=cl((t-13.6)/.2);pop('f3',13.9,t);
  if(t>=14.3&&t<14.45)$('f3').style.transform='scale(.94)'}
}
(async()=>{await document.fonts.load('900 100px PL');await document.fonts.load('800 40px PR');window.seek=t=>{draw0(t);const p=g.getImageData(4,4,1,1).data;document.body.style.background=`rgb(${p[0]},${p[1]},${p[2]})`;const fr=document.getElementById('zsfr').getContext('2d');fr.clearRect(0,0,1080,1920);FXK.frame(fr,{ai:'AI가 계산·작성한 콘텐츠예요'})};seek(0)})();
</script><canvas id="zsfr" width="1080" height="1920" style="position:absolute;left:0;top:0;z-index:99;pointer-events:none"></canvas></body></html>
