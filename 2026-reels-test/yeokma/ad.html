<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#2B2350}canvas{position:absolute;inset:0}</style></head><body><canvas id="cv" width="1080" height="1920"></canvas>
<script src="../../pipeline/motion_fx.js"></script><script>
// 11/17 17:00 릴스 실험 C(그림 — 코드로 그린 평면 일러스트, 색 3개, 카메라 이동·시차) — 역마. 문장·띠 묶음은 네이버 n21 원고 그대로(engine/dapjang_move.py YEOKMA 와 같음).
window.FX=['글자늘이기','낱말블록교체','칩줄세우기','공튀기기','덮개그리기'];
const F=FXK,{cl,mix,ease,eio,sp}=F,BG='#2B2350',H1='#3E3470',H2='#56489A',OR='#F2A65A',IV='#F8F3E8',g=document.getElementById('cv').getContext('2d');
window.SFX=[{t:.1,k:'whoosh'},{t:.4,k:'pop'},{t:.25,k:'pop'},{t:1.4,k:'thud'},{t:2.9,k:'swoosh'},{t:3.3,k:'boing'},{t:4.4,k:'chime'},
 {t:5.6,k:'whoosh'},{t:5.9,k:'pop'},{t:6.2,k:'pop'},{t:6.5,k:'pop'},{t:6.8,k:'pop'},{t:10.9,k:'whoosh'},{t:11.3,k:'ding'},{t:13.1,k:'swoosh'},{t:13.5,k:'pop'},{t:14.3,k:'ding'}];
function T(txt,x,y,font,color,align='center'){g.font=font;g.fillStyle=color;g.textAlign=align;g.textBaseline='middle';g.fillText(txt,x,y)}
function fade(t,a,b){return cl((t-a)/.25)*cl((b-t)/.25)}
// 평면 풍경: 언덕 두 겹(시차) + 해 + 길. cam = 카메라가 오른쪽으로 간 거리
function land(t,cam,yb){
 g.fillStyle=H1;g.beginPath();g.moveTo(0,1920);for(let x=0;x<=1080;x+=20){g.lineTo(x,yb-260+Math.sin((x+cam*.4)/170)*70)}g.lineTo(1080,1920);g.fill();
 g.fillStyle=H2;g.beginPath();g.moveTo(0,1920);for(let x=0;x<=1080;x+=20){g.lineTo(x,yb-90+Math.sin((x+cam*.9)/120+1)*45)}g.lineTo(1080,1920);g.fill();
 g.fillStyle=BG;g.fillRect(0,yb,1080,1920-yb);g.fillStyle=OR;for(let i=-1;i<9;i++){const x=((i*160-cam)%1280+1280)%1280-100;g.fillRect(x,yb+40,90,14)}}
function suitcase(x,y,s,rot){g.save();g.translate(x,y);g.rotate(rot);g.scale(s,s);g.fillStyle=OR;g.beginPath();g.roundRect(-90,-130,180,220,28);g.fill();
 g.fillStyle=BG;g.fillRect(-40,-170,80,20);g.fillRect(-50,-170,16,46);g.fillRect(34,-170,16,46);g.fillStyle=IV;g.fillRect(-90,-40,180,22);
 g.fillStyle=BG;g.beginPath();g.arc(-55,105,18,0,7);g.arc(55,105,18,0,7);g.fill();g.restore()}
function draw(t){const X=F.cx;g.fillStyle=BG;g.fillRect(0,0,1080,1920);
 for(let i=0;i<34;i++){g.fillStyle='rgba(248,243,232,.22)';g.beginPath();g.arc(F.H(i)*1080,F.H(i+4)*900+80,2+F.H(i+7)*3,0,7);g.fill()}
 const cam=t*260;
 // 1 훅 — 글자 늘이기 + 도장
 if(t<2.9){land(t,cam,1760);const a=cl((2.9-t)/.25);g.save();g.globalAlpha=a;
  const s1=sp(t+.3,14,.6);g.save();g.translate(X,790);g.scale(s1,s1);T('역마살 있으면',0,0,'900 104px PL',IV);g.restore();
  if(t>.2){const p=ease(cl((t-.2)/.5));g.save();g.translate(X,950);g.scale(mix(1.6,1,p),1);g.globalAlpha*=p;T('떠돌이 팔자?',0,0,'900 128px PL',OR);g.restore()}
  if(t>1.4){const b=sp(t-1.4,16,.5);g.save();g.translate(X,1150);g.rotate(0);g.scale(b,b);g.strokeStyle=IV;g.lineWidth=12;g.beginPath();g.roundRect(-270,-100,540,200,28);g.stroke();T('아니에요',0,4,'900 110px PL',IV);g.restore()}
  g.restore()}
 // 2 가방이 길을 굴러감(공 튀기기) + 한 줄
 if(t>=2.8&&t<5.7){const a=fade(t,2.8,5.7);g.save();g.globalAlpha=a;
  g.fillStyle=H1;g.beginPath();g.roundRect(X-380,1200,760,40,20);g.fill();g.fillStyle=OR;for(let i=0;i<6;i++){const x=X-360+((i*140-cam)%840+840)%840*0.86;g.fillRect(x,1214,70,12)}
  const u=t-3,by=1110-Math.abs(Math.sin(u*6))*Math.exp(-u*1.2)*160;suitcase(X,by,1,Math.sin(u*6)*.08);
  T('움직이고 있을 때',X,620,'900 96px PL',IV);if(t>4.4){const b=sp(t-4.4,14,.6);g.save();g.translate(X,760);g.scale(b,b);T('숨이 쉬어지는 사주',0,0,'900 96px PL',OR);g.restore()}
  g.restore()}
 // 3 내 띠로 찾는 역마 자리 — 네 줄 블록
 if(t>=5.6&&t<11.1){const a=fade(t,5.6,11.1);g.save();g.globalAlpha=a;
  T('내 띠로 찾는 역마 자리',X,600,'900 84px PL',IV);
  const R=[['원숭이·쥐·용띠','호랑이'],['호랑이·말·개띠','원숭이'],['뱀·닭·소띠','돼지'],['돼지·토끼·양띠','뱀']];
  R.forEach(([l,r],i)=>{const b=sp(t-5.9-i*.3,14,.62);if(b<=0)return;const y=780+i*165;g.save();g.translate(X+(1-b)*-60,y);g.globalAlpha*=cl(b*2);
   g.fillStyle=i%2?H2:H1;g.beginPath();g.roundRect(-400,-66,800,132,30);g.fill();T(l,-370,2,'900 58px PL',IV,'left');T('→',140,2,'900 58px PL',OR);
   g.fillStyle=OR;g.beginPath();g.roundRect(190,-50,200,100,50);g.fill();T(r,290,2,`900 ${r.length>2?46:52}px PL`,BG);g.restore()});
  g.restore()}
 // 4 뜻 — 낱말 블록 교체
 if(t>=10.9&&t<13.2){const a=fade(t,10.9,13.2);g.save();g.globalAlpha=a;land(t,cam,1560);
  T('이동·출장·이사·해외',X,700,'900 84px PL',IV);
  const W=['도망','충전'],k=t>11.9?1:0,b=sp(t-(k?11.9:11.2),15,.55);g.save();g.translate(X,920);g.scale(b,b);g.fillStyle=k?OR:H2;g.beginPath();g.roundRect(-230,-90,460,180,40);g.fill();T(W[k],0,4,'900 120px PL',k?BG:IV);g.restore();
  if(t>12.2)T('떠나는 건 내 방식의 충전',X,1160,'900 72px PL',IV);
  g.restore()}
 // 5 행동
 if(t>=13){const a=cl((t-13)/.25);g.save();g.globalAlpha=a;
  const s=sp(t-13.3,14,.6);g.save();g.translate(X,790);g.scale(s,s);T('같은 띠라도',0,0,'900 92px PL',IV);T('태어난 날마다 달라요',0,120,'900 92px PL',OR);g.restore();
  const b=sp(t-14.1,14,.6);g.save();g.translate(X,1130);g.scale(b,b);g.fillStyle=IV;g.beginPath();g.roundRect(-330,-66,660,132,66);g.fill();T('생일만 넣으면 무료 판정 →',0,-2,'900 50px PL','#111');g.restore();
  g.restore()}
 F.frame(g,{ai:'AI가 계산·작성한 콘텐츠예요'});
}
(async()=>{await window.__zsFonts;for(const f of ['900 100px PL','800 40px PR'])await document.fonts.load(f);window.seek=draw;draw(0)})();
</script></body></html>
