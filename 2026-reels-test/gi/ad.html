<!-- 11/25(수) 17:00 인스타 릴스 실험 칸 · 형식 E(카톡 대화 모션) · 일간 기(己)
     글: 2026-ilgan3/build.py REELS gi 문장 그대로(훅·둘째 줄·기운·까닭·해 볼 것). 새 문장은 단톡 몇 마디·할 일 알림 넷·끝 장면뿐.
     단톡은 훅('모임이 끝나면 뒷정리는 내 차지예요')을 장면으로 보여 주는 예시 대화 — 숫자·통계 없음.
     정월 없음(K-197). 화면에 한자 없음. 판 k_gold(#121212 + 골드 #C5A35A + 크림 #F6F0E5, 3회차 기 판 그대로).
     color_combos 메모 '검정+금색만 판은 대표가 싫어함 → 크림 면을 함께'에 따라 말풍선·알림·끝 장면을 크림 면으로, 골드는 강조 낱말·선에만.
     글 칸 x 50~900(가운데 FXK.cx), 보이는 것끼리 묶어 칸 세로 가운데(K-203). -->
<style>
@font-face{font-family:PL;src:url(../../pipeline/fonts/Paperlogy-9Black.ttf)}
@font-face{font-family:PR;src:url(../../pipeline/fonts/PRETENDARD-EXTRABOLD.OTF)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#121212}

</style></head><body><div id="s"><canvas id="cv" width="1080" height="1920"></canvas>
<div id="a1" class="t" style="top:515px;font:900 120px/1.1 PL;color:#F6F0E5;letter-spacing:-4px">모임이 끝나면</div>
<div id="a2" class="t" style="top:700px;font:900 150px/1.1 PL;color:#F6F0E5;letter-spacing:-4px">뒷정리는</div>
<div id="a3" class="t" style="top:919px;font:900 150px/1.1 PL;color:#C5A35A;letter-spacing:-4px">내 차지예요</div>
<div id="a4" class="t" style="top:1135px;font:800 60px/1.48 PR;color:#A8A29A">티 안 나는 일을<br>먼저 챙겨요</div>
<div id="c1" class="t" style="top:470px;font:900 104px/1.48 PL;color:#F6F0E5">씨앗을 키우는<br><span style="color:#C5A35A">밭 기운</span>이에요</div>
<div id="d1" class="t" style="top:470px;font:900 88px PL;color:#F6F0E5">챙기는 게 <span style="color:#C5A35A">당연해지면</span></div>
<div id="d2" class="t" style="top:1262px;font:900 84px PL;color:#F6F0E5">금방 지쳐요</div>
<div id="e1" class="t" style="top:490px;font:900 96px/1.5 PL;color:#F6F0E5">정리 하나를<br><span style="color:#C5A35A">남에게 부탁해</span><br>보세요</div>
<div id="f1" class="t" style="top:521px;font:900 120px/1.45 PL;color:#121212">내 첫 글자도<br>기일까?</div>
<div id="f2" class="t" style="top:935px;font:800 64px PR;color:#121212">생일만 넣으면 무료 판정</div>
<div id="f3" class="t" style="top:1142px;left:140px;right:270px;height:150px;border-radius:999px;background:#121212;color:#C5A35A;font:900 66px/150px PL">프로필 링크 ↗</div>
</div>
<script src="../../pipeline/motion_fx.js"></script>
<script>
window.FX=['채팅말풍선','속마음쾅','덮개그리기','알림접기','원와이프'];
const {cl,mix,ease,eio,sp}=FXK,BK='#121212',BK2='#1C1C1C',GD='#C5A35A',CR='#F6F0E5',SUB='#A8A29A';
const $=id=>document.getElementById(id),g=$('cv').getContext('2d'),vis=(id,on)=>$(id).style.display=on?'':'none';
window.SFX=[{t:.3,k:'press'},{t:.8,k:'press'},{t:2.25,k:'swoosh'},{t:2.55,k:'tick'},{t:3.1,k:'tick'},{t:3.65,k:'tick'},{t:4.3,k:'press'},
 {t:6.25,k:'swoosh'},{t:6.7,k:'tick'},{t:7.4,k:'chime'},{t:8.45,k:'swoosh'},{t:8.9,k:'tick'},{t:9.2,k:'tick'},{t:9.5,k:'tick'},{t:9.8,k:'tick'},{t:10.3,k:'press'},
 {t:10.85,k:'swoosh'},{t:11.35,k:'tick'},{t:11.9,k:'tick'},{t:13.0,k:'swoosh'},{t:13.6,k:'chime'},{t:14.3,k:'press'}];
// 말풍선(캔버스). 칸 x 80~880 안. 왼쪽 말풍선은 위에 보낸 사람 이름
function bubH(text,fs=60,name){return String(text).split('\n').length*Math.round(fs*1.32)+56+(name?58:0)}
function bub(text,side,y,a,{fs=60,name}={}){if(a<=0)return;const lines=String(text).split('\n'),lh=Math.round(fs*1.32);g.save();g.font=`800 ${fs}px PR`;
 const w=Math.min(760,Math.max(...lines.map(l=>g.measureText(l).width))+88),h=bubH(text,fs),x=side=='l'?Math.min(130,880-w):880-w,top=y+(name?58:0);
 g.globalAlpha=cl(a);g.translate(side=='l'?x:x+w,top+h);g.scale(a,a);g.translate(side=='l'?0:-w,-h);
 if(name){g.fillStyle=SUB;g.font='800 40px PR';g.textBaseline='top';g.textAlign='left';g.fillText(name,8,-54);g.font=`800 ${fs}px PR`}
 g.fillStyle=side=='l'?CR:GD;g.beginPath();g.roundRect(0,0,w,h,[44,44,side=='l'?44:12,side=='l'?12:44]);g.fill();
 g.fillStyle=BK;g.textBaseline='top';g.textAlign='left';lines.forEach((l,i)=>g.fillText(l,44,28+i*lh));g.restore()}
// 속마음 쾅
function inner(text,y,a,t,t0){if(a<=0)return;const lines=text.split('\n');g.save();g.translate(FXK.cx,y+85);const s=mix(1.7,1,a);g.rotate(mix(-.16,-.05,a));g.scale(s,s);
 if(t-t0<.25){g.translate(Math.sin((t-t0)*70)*8,0)}g.font='900 84px PL';g.textAlign='center';g.textBaseline='middle';g.fillStyle=GD;lines.forEach((l,i)=>g.fillText(l,0,(i-.5*(lines.length-1))*120));g.restore()}
// 보이는 것끼리 쌓아 칸 세로 가운데에
function stack(t,items,cy=907,gap=48){const v=items.map(it=>({...it,a:sp(t-it.t0,15,.62)})).filter(it=>t>=it.t0);
 const hs=v.map(it=>it.h*Math.min(1,eio(cl((t-it.t0)/.28))));const H=hs.reduce((s,h)=>s+h,0)+gap*Math.max(0,v.length-1);let y=cy-H/2;
 v.forEach((it,i)=>{it.draw(y,it.a);y+=hs[i]+gap})}
function pop(id,t0,t,k=15,z=.6){const a=sp(t-t0,k,z);$(id).style.transform=`scale(${a})`;$(id).style.opacity=t>=t0?1:0}
function rise(id,t0,t){const a=sp(t-t0,14,.7);$(id).style.transform=`translateY(${(1-a)*90}px)`;$(id).style.opacity=cl((t-t0)/.12)}
function wipe(t,t0,col,y=907){if(t>=t0&&t<t0+.42){g.fillStyle=col;g.beginPath();g.arc(FXK.cx,y,eio((t-t0)/.42)*1500,0,7);g.fill()}}
// 밭: 고랑 세 줄이 그려지고(덮개그리기) 싹이 차례로 돋음
function field(t,t0){const rows=[935,1100,1265],x0=140,x1=810;g.save();g.lineCap='round';
 rows.forEach((y,k)=>{const p=eio(cl((t-t0-k*.08)/.35));if(p<=0)return;g.strokeStyle=k%2?'#8A7444':GD;g.lineWidth=14;g.beginPath();
  for(let i=0;i<=40*p;i++){const u=i/40,x=mix(x0,x1,u);const yy=y+Math.sin(u*Math.PI*3)*8;i?g.lineTo(x,yy):g.moveTo(x,yy)}g.stroke();
  for(let j=0;j<5;j++){const u=(j+.5)/5,x=mix(x0,x1,u),s=sp(t-t0-.3-k*.08-j*.05,15,.55);if(s<=0)continue;g.save();g.translate(x,y-10);g.scale(s,s);
   g.strokeStyle=CR;g.lineWidth=8;g.beginPath();g.moveTo(0,0);g.lineTo(0,-44);g.stroke();g.fillStyle=CR;
   g.beginPath();g.ellipse(-26,-50,28,14,-.6,0,7);g.fill();g.beginPath();g.ellipse(26,-56,28,14,.6,0,7);g.fill();g.restore()}});g.restore()}
// 할 일 알림: 하나씩 쌓였다가 한 장으로 접힘(알림접기)
const TODO=['컵 모아서 치우기','의자 제자리에','계산 나누기','막차 시간 알려 주기'];
function notes(t,t0){const fold=eio(cl((t-t0-1.45)/.45)),cy=940,h=120,gap=30,n=TODO.length;g.save();
 for(let i=n-1;i>=0;i--){const a=sp(t-t0-i*.3,15,.62);if(a<=0)continue;const open=cy-((n-1)*(h+gap))/2+i*(h+gap),closed=cy+i*14;const y=mix(open,closed,fold);
  const sc=mix(1,1-i*.04,fold);g.save();g.globalAlpha=cl(a)*(i&&fold>.98?.85:1);g.translate(FXK.cx,y);g.scale(sc*a,sc*a);
  g.fillStyle=i?mix_(CR,'#D9D2C4',fold):CR;g.beginPath();g.roundRect(-380,-h/2,760,h,36);g.fill();
  g.fillStyle=GD;g.beginPath();g.arc(-320,0,20,0,7);g.fill();
  const tx=fold<.5?TODO[i]:(i?'':`할 일 ${n}개가 또 내 차지`),ta=fold<.5?1-fold*2:(fold-.5)*2;
  if(tx){g.globalAlpha*=cl(ta);g.fillStyle=BK;g.font='800 60px PR';g.textAlign='left';g.textBaseline='middle';g.fillText(tx,-262,2)}
  g.restore()}g.restore()}
function mix_(a,b,k){const p=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));const A=p(a),B=p(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')})`}
// 단톡방 이름 칩
function chip(text,y,a){if(a<=0)return;g.save();g.globalAlpha=cl(a);g.font='800 60px PR';const w=g.measureText(text).width+90;g.translate(FXK.cx,y+55);g.scale(a,a);
 g.fillStyle='rgba(246,240,229,.12)';g.beginPath();g.roundRect(-w/2,-55,w,110,55);g.fill();g.fillStyle=CR;g.textAlign='center';g.textBaseline='middle';g.fillText(text,0,3);g.restore()}
// 토스트(안 씀): 체크와 함께 뜨는 알림 줄
function toast(t,t0,y){const a=sp(t-t0,15,.62);if(a<=0)return;g.save();g.globalAlpha=cl(a);g.translate(FXK.cx,y+(1-a)*60);
 g.fillStyle=BK2;g.strokeStyle=GD;g.lineWidth=5;g.beginPath();g.roundRect(-330,-60,660,120,60);g.fill();g.stroke();
 const c=eio(cl((t-t0-.15)/.3));g.strokeStyle=GD;g.lineWidth=12;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(-262,2);
 if(c>0){g.lineTo(mix(-262,-240,cl(c*2)),mix(2,24,cl(c*2)));if(c>.5)g.lineTo(mix(-240,-200,(c-.5)*2),mix(24,-22,(c-.5)*2))}g.stroke();
 g.fillStyle=CR;g.font='800 52px PR';g.textAlign='left';g.textBaseline='middle';g.fillText('부탁 하나 보냈어요',-160,2);g.restore()}
function draw0(t){
 let bg=BK; if(t>=13.2)bg=CR; g.fillStyle=bg;g.fillRect(0,0,1080,1920);
 // 1 훅(0초부터 글자 다 보임, K-139)
 const s1=t<2.4;['a1','a2','a3','a4'].forEach(i=>vis(i,s1));
 if(s1){const a=sp(t+.25,16,.55),b=sp(t+.1,16,.55);$('a1').style.transform=`scale(${mix(.86,1,a)})`;$('a2').style.transform=`translateX(${mix(-40,0,b)}px)`;
  const c=sp(t+.05,14,.6);$('a3').style.transform=`translateX(${mix(60,0,c)}px) rotate(${mix(4,0,c)}deg)`;
  $('a4').style.opacity=cl((t-.4)/.2);$('a4').style.transform=`translateY(${(1-sp(t-.4,14,.7))*60}px)`}
 // 2 단톡: 다들 먼저 감 → (속마음 쾅) → 내가 정리
 wipe(t,2.2,BK2);const s2=t>=2.4&&t<6.4;
 if(s2){g.fillStyle=BK2;g.fillRect(0,0,1080,1920);
  stack(t,[{t0:2.55,h:bubH('오늘 진짜 너무 재밌었다!'),draw:(y,a)=>bub('오늘 진짜 너무 재밌었다!','l',y,a)},
   {t0:3.1,h:bubH('난 막차라 먼저 갈게~'),draw:(y,a)=>bub('난 막차라 먼저 갈게~','l',y,a)},
   {t0:3.65,h:170,draw:(y,a)=>inner('(누가 치우지…)',y,a,t,3.65)},
   {t0:4.3,h:bubH('정리는 내가 할게ㅎㅎ'),draw:(y,a)=>bub('정리는 내가 할게ㅎㅎ','r',y,a)}])}
 // 3 밭 기운
 wipe(t,6.2,BK);const s3=t>=6.4&&t<8.6;vis('c1',s3);
 if(s3){rise('c1',6.45,t);field(t,6.0)}
 // 4 까닭: 할 일 알림이 쌓이다 한 장으로 접힘
 wipe(t,8.4,BK2);const s4=t>=8.6&&t<11.0;['d1','d2'].forEach(i=>vis(i,s4));
 if(s4){g.fillStyle=BK2;g.fillRect(0,0,1080,1920);rise('d1',8.65,t);notes(t,8.9);rise('d2',8.75,t)}
 // 5 해 볼 것: 이번엔 부탁 → 답 → 토스트
 wipe(t,10.8,BK);const s5=t>=11.0&&t<13.2;vis('e1',s5);
 if(s5){rise('e1',11.05,t);bub('컵만 같이 치워 줄래?','r',975,sp(t-11.35,15,.6));bub('당연하지! 내가 할게','l',1160,sp(t-11.9,15,.6))}
 // 6 끝
 wipe(t,13.0,CR);const s6=t>=13.2;['f1','f2','f3'].forEach(i=>vis(i,s6));
 if(s6){const a=sp(t-13.2,15,.62);$('f1').style.transform=`scale(${mix(1.3,1,a)})`;$('f2').style.opacity=cl((t-13.6)/.2);pop('f3',13.9,t);
  if(t>=14.3&&t<14.45)$('f3').style.transform='scale(.94)'}
}
(async()=>{await document.fonts.load('900 100px PL');await document.fonts.load('800 40px PR');window.seek=t=>{draw0(t);const p=g.getImageData(4,4,1,1).data;document.body.style.background=`rgb(${p[0]},${p[1]},${p[2]})`;const fr=document.getElementById('zsfr').getContext('2d');fr.clearRect(0,0,1080,1920);FXK.frame(fr,{ai:'AI가 계산·작성한 콘텐츠예요'})};seek(0)})();
</script><canvas id="zsfr" width="1080" height="1920" style="position:absolute;left:0;top:0;z-index:99;pointer-events:none"></canvas></body></html>
