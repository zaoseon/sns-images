<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:PL;src:url(../../../pipeline/fonts/Paperlogy-9Black.ttf)}
@font-face{font-family:PR;src:url(../../../pipeline/fonts/PRETENDARD-EXTRABOLD.OTF)}
@font-face{font-family:SR;src:url(../../../pipeline/fonts/serif.otf)}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#171717}
#s{position:absolute;inset:0;overflow:hidden}canvas{position:absolute;inset:0}
.t{position:absolute;left:0;right:0;text-align:center;white-space:nowrap}
.cd{position:absolute;left:150px;right:150px;top:560px;height:860px;border-radius:40px;backface-visibility:hidden;box-sizing:border-box}
#brand{position:absolute;top:300px;left:90px;font:900 44px PL}#ai{position:absolute;bottom:300px;left:0;right:0;text-align:center;font:800 32px PR}
.tag{position:absolute;right:90px;top:420px;font:800 34px PR}
.pill{position:absolute;left:150px;right:150px;height:150px;border-radius:999px;background:#FF4F9A;color:#171717;font:900 64px PL;line-height:150px;text-align:center}
</style></head><body><div id="s"><canvas id="cv" width="1080" height="1920"></canvas>
<div id="h1" class="t" style="top:820px;font:900 150px PL;letter-spacing:-5px;color:#fff">왜 없는 건데</div>
<div id="h0" class="t" style="top:700px;font:italic 400 84px SR;color:#fff">아니.. 걔는</div>
<div id="q2" class="t" style="top:560px;font:800 64px PR;color:#171717">그 사람이 다시<br><b style="font:900 92px PL">생각나는 달</b></div>
<div id="c3" class="t" style="top:1400px;padding:22px 0;background:rgba(23,23,23,.92);font:800 54px PR;color:#fff">두 사람 생일로 <b style="color:#FF4F9A">둘 사이 흐름</b>을 봐요</div>
<div id="c4" class="t" style="top:830px;font:900 130px PL;color:#171717"></div>
<div id="c4b" class="t" style="top:1340px;font:800 52px PR;color:#171717">동서양 운명학 여섯 가지로 맞춰 보는 중</div>
<div id="fr" class="cd" style="background:#171717;color:#FF4F9A;text-align:center;padding-top:300px"><div style="font:900 120px PL">정월의<br>답장</div></div>
<div id="bk" class="cd" style="background:#FFF1F5;color:#171717;padding:80px 70px;font:800 50px/1.6 PR">
 <div style="font:italic 400 64px SR;margin-bottom:30px">이 마음에게</div>그 사람 마음이 궁금하지?<br>두 사람 생일로<br>둘 사이 흐름을 읽어서<br><b style="color:#E0307A">편지로 답해 줄게.</b><div style="font:900 52px PL;margin-top:50px;text-align:right">— 정월</div></div>
<div id="e1" class="t" style="top:600px;font:900 116px PL;letter-spacing:-4px;color:#fff;line-height:1.15">기다리지만 말고<br><span style="color:#FF4F9A">먼저 물어봐</span></div>
<div id="e3" class="pill" style="top:1060px">무료 판정 보기</div>
<div id="e4" class="t" style="top:1260px;font:800 46px PR;color:#C8C8C8">zaoseon.com</div>
<div id="ex" class="tag">예시</div><div id="brand">자오선</div><div id="ai">AI가 계산·작성한 콘텐츠예요</div></div>
<script src="../../../pipeline/motion_fx.js"></script>
<script>
window.FX=['글자겹쳐쌓기','슬롯롤링','점파동','궤도링','카드뒤집기','궤적선'];
const {cl,mix,ease,eio,sp}=FXK, PK='#FF4F9A',BK='#171717',LG='#F5F5F5',PL='#FFF1F5';
const $=id=>document.getElementById(id), g=$('cv').getContext('2d'), vis=(id,on)=>$(id).style.display=on?'':'none';
window.SFX=[{t:0,k:'swoosh'},...[0,1,2,3,4,5].map(i=>({t:.2+i*.25,k:'tick'})),{t:1.8,k:'press'},{t:2.6,k:'swoosh'},
 ...Array.from({length:16},(_,i)=>({t:3+i*.09,k:'tick'})),{t:4.4,k:'chime'},{t:5.2,k:'swoosh'},{t:5.6,k:'chime'},{t:6.2,k:'chime'},{t:7.4,k:'chime'},
 {t:8.2,k:'swoosh'},{t:10,k:'chime'},{t:10.4,k:'swoosh'},{t:11,k:'swoosh'},{t:11.6,k:'chime'},{t:12.8,k:'swoosh'},{t:13.6,k:'press'},{t:14.3,k:'press'},{t:14.3,k:'chime'}];
function seek(t){
 let bg=t<2.6?BK:t<5.2?PK:t<8.2?BK:t<10.4?LG:t<12.8?PK:BK;
 if(t>=2.3&&t<2.6){bg=BK} g.fillStyle=bg;g.fillRect(0,0,1080,1920);
 // 1 글자겹쳐쌓기 + 큰 말
 if(t<2.6){FXK.stack(g,t,.15,{word:'연락',y0:420,dy:186,n:6,step:.25});
  if(t>=1.75){g.fillStyle='rgba(23,23,23,'+cl((t-1.75)/.12)*.75+')';g.fillRect(0,0,1080,1920)}}
 vis('h0',t>=1.75&&t<2.6);vis('h1',t>=1.8&&t<2.6);
 if(t>=1.8&&t<2.6){const a=sp(t-1.8,16,.6);$('h1').style.transform=`scale(${mix(1.6,1,a)})`;$('h0').style.opacity=cl((t-1.75)/.15)}
 if(t>=2.3&&t<2.6){const r=eio((t-2.3)/.3)*1300;g.fillStyle=PK;g.beginPath();g.arc(540,1700,r*1.6,0,7);g.fill()}
 // 2 슬롯롤링
 vis('q2',t>=2.6&&t<5.2);
 if(t>=2.6&&t<5.2){const a=sp(t-2.6,12,.75);$('q2').style.transform=`translateY(${(1-a)*60}px)`;$('q2').style.opacity=cl((t-2.6)/.15);
  g.fillStyle='rgba(23,23,23,.1)';g.fillRect(90,830,900,300);
  FXK.slot(g,t,2.9,4.4,{words:['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'],target:'4월',y:980,h:300,font:'900 240px PL'});
  if(t>=4.4){const s=sp(t-4.4,16,.55);g.strokeStyle=BK;g.lineWidth=10;g.strokeRect(540-260*s,830,520*s,300)}
  if(t>=4.9){const r=eio((t-4.9)/.3)*2000;g.fillStyle=BK;g.fillRect(0,1920-r,1080,r)}}
 // 3 점파동 + 두 점 잇기
 vis('c3',t>=6.6&&t<8.2);
 if(t>=5.2&&t<8.4){const A=[315,795],B=[765,1170];FXK.dotwave(g,t,5.3,{centers:[A,B]});
  [A,B].forEach((p,k)=>{const s=sp(t-5.5-k*.6,14,.55);g.fillStyle=PK;g.beginPath();g.arc(p[0],p[1],34*s,0,7);g.fill();
   g.fillStyle='#fff';g.font='800 40px PR';g.textAlign='center';if(s>.6)g.fillText(k?'그 사람':'나',p[0],p[1]-60)});
  const q=eio((t-6.6)/.8);if(q>0){g.strokeStyle=PK;g.lineWidth=8;g.setLineDash([2,18]);g.lineCap='round';g.beginPath();g.moveTo(A[0],A[1]);
   g.bezierCurveTo(A[0]+380,A[1]-60,B[0]-380,B[1]+60,mix(A[0],B[0],q),mix(A[1],B[1],q));g.stroke();g.setLineDash([])}
  $('c3').style.opacity=cl((t-6.6)/.2);
  if(t>=7.9){const r=eio((t-7.9)/.35)*1400;g.fillStyle=LG;g.beginPath();g.arc(B[0],B[1],r*1.5,0,7);g.fill()}}
 // 4 궤도링
 vis('c4',t>=8.2&&t<10.4);vis('c4b',t>=8.2&&t<10.4);
 if(t>=8.2&&t<10.6){const p=eio((t-8.4)/1.5);FXK.ring(g,t,{y:900,p});$('c4').textContent=Math.round(p*100)+'%';
  $('c4').style.transform=`scale(${t>=9.9?mix(1.15,1,sp(t-9.9,16,.6)):1})`;$('c4b').style.opacity=cl((t-8.5)/.2);
  if(t>=10.15){const r=eio((t-10.15)/.3)*2000;g.fillStyle=PK;g.fillRect(0,0,1080,r)}}
 // 5 카드뒤집기
 const s5=t>=10.4&&t<12.9;vis('fr',s5);vis('bk',s5);
 if(s5){const a=sp(t-10.4,11,.7);const base=`translateY(${(1-a)*500}px)`;FXK.flip($('fr'),$('bk'),t,11,.65);
  $('fr').style.transform=base+' '+$('fr').style.transform;$('bk').style.transform=base+' '+$('bk').style.transform;
  const o=t>12.6?1-ease((t-12.6)/.25):1;$('fr').style.opacity=o;$('bk').style.opacity=o}
 // 6 끝: 궤적선이 단추 둘레를 돎
 const s6=t>=12.8;['e1','e3','e4'].forEach(i=>vis(i,s6));
 if(s6){const a=sp(t-12.85,15,.62);$('e1').style.transform=`scale(${mix(1.4,1,a)})`;$('e1').style.opacity=cl((t-12.85)/.1);
  const b=sp(t-13.4,13,.65);$('e3').style.opacity=cl((t-13.4)/.1);$('e3').style.transform=`scale(${t>=14.3&&t<14.45?.93:mix(.5,1,b)})`;
  $('e4').style.opacity=cl((t-13.7)/.2);
  FXK.trail(g,t,13.5,1.4,u=>{const ang=-Math.PI/2+u*6.283*1.1;return[540+Math.cos(ang)*430,1135+Math.sin(ang)*120]},{loop:true,r:14})}
 const dark=(bg==BK);$('brand').style.color=dark?PK:BK;$('ai').style.color=dark?'#9A9A9A':'#555';$('ex').style.color=dark?'#9A9A9A':'#555';
 vis('ex',t>=2.6&&t<5.2);
}
(async()=>{await document.fonts.load('900 100px PL');await document.fonts.load('800 40px PR');await document.fonts.load('italic 400 40px SR');window.seek=seek;seek(0)})();
</script></body></html>
